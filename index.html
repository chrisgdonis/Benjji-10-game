<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Benjji 10</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a10; color: #eaffea;
    font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #game { display: block; margin: 0 auto; background: #1d3b52; max-width: 100%; }
  #stopBtn { position: absolute; top: 58px; left: 10px; padding: 4px 12px;
    border-radius: 14px; border: 2px solid #ffffff; background: #d6303099; color: #fff; font-weight: 700; font-size: 12px; }
  #restartBtn { position: absolute; top: 58px; left: 92px; padding: 4px 12px;
    border-radius: 14px; border: 2px solid #ffffff; background: #2a6cf099; color: #fff; font-weight: 700; font-size: 12px; }
  #restartBtn.sure { background: #ffd23a; color: #000; }
  #stopBtn.paused { background: #39ff6acc; color: #000; }
  #hud { position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-weight: 700; text-shadow: 0 2px 0 #000; pointer-events: none; }
  .pad { position: absolute; bottom: 10px; display: flex; gap: 6px; align-items: center; opacity: 0.8; }
  .pad button { width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 2px solid #39ff6a;
    background: #102a1799; color: #eaffea; font-size: 17px; font-weight: 700; }
  #left { left: 10px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 30px); gap: 2px; }
  .pad .dpad button { width: 36px; height: 30px; border-radius: 9px; font-size: 13px; }
  .dpad .up { grid-area: 1 / 2; } .dpad .lt { grid-area: 2 / 1; } .dpad .rt { grid-area: 2 / 3; } .dpad .dn { grid-area: 3 / 2; }
  #right { right: 10px; }
  #allBtn { background: linear-gradient(135deg, #ff6a1a, #39ff6a, #2a6cf0); color: #000; font-size: 11px; border-color: #ffffff; }
  #mutateBtn { background: #a83cffcc; color: #fff; font-size: 7px; border-color: #e0b0ff; }
  #powerBtn { background: #ff8a1fcc; color: #000; font-size: 9px; border-color: #ffd23a; }
  #watchBtn { width: 54px; height: 54px; background: #39ff6acc; color: #000; font-size: 10px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div id="hud">Benjji · Shift to pick an alien</div>
<button id="stopBtn">⏸ STOP</button>
<button id="restartBtn">↻ RESTART</button>
<div class="pad" id="left">
  <div class="dpad">
    <button data-key="back" class="up">▲</button>
    <button data-key="left" class="lt">◀</button>
    <button data-key="right" class="rt">▶</button>
    <button data-key="front" class="dn">▼</button>
  </div>
  <button id="allBtn" data-key="all">ALL</button>
</div>
<div class="pad" id="right">
  <button data-key="jump" style="font-size:9px">JUMP</button>
  <button data-key="swap" style="font-size:9px">SWAP</button>
  <button id="mutateBtn" data-key="mutate">MUTATE</button>
  <button id="powerBtn" data-key="power">POWER</button>
  <button id="watchBtn" data-key="watch">WATCH</button>
</div>
<script>
const canvas = document.getElementById('game');
let ctx = canvas.getContext('2d'); // swapped for a moment to draw the picker's holograms
const hud = document.getElementById('hud');
const W = canvas.width, H = canvas.height, GROUND = H - 70;
const WORLD = 4000; // how wide the whole city is
let cam = 0;        // left edge of the screen, in the city
// 2.5D: z is how far back on the street something is, from 0 (front) to DEPTH (back).
// Things further back are drawn higher up and a little smaller.
const DEPTH = 100;
const floorShift = z => 40 - z * 1.1;
const depthScale = z => 1 - z * 0.0028;
const near = (z1, z2, range) => Math.abs(z1 - z2) < range;
function atDepth(x, z, draw) {
  const s = depthScale(z);
  ctx.save();
  ctx.translate(x, GROUND + floorShift(z)); ctx.scale(s, s); ctx.translate(-x, -GROUND);
  draw();
  ctx.restore();
}
function shadow(x, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(x, GROUND, w, w * 0.22, 0, 0, Math.PI * 2); ctx.fill();
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// The watch's aliens: the first ten from the show, plus Cannonbolt, Wildvine and Upchuck,
// who were unlocked later. Each one moves differently and has its own powers:
// P uses the power, O swaps to the next one.
const ALIENS = [
  { name: 'Heatblast',   draw: drawHeatblast,   speed: 5,   jump: 13, size: 1.0,  fly: true,
    powers: [['Fireballs', fireballs], ['Flamethrower', flamethrower], ['Fire rocket blast', fireJump]] },
  { name: 'Wildmutt',    draw: drawWildmutt,    speed: 8,   jump: 14, size: 1.0,
    powers: [['Super pounce', pounce], ['Claw slash', clawSlash], ['Mega roar', roar]] },
  { name: 'Diamondhead', draw: drawDiamondhead, speed: 4.5, jump: 11, size: 1.05, reflect: true,
    powers: [['Crystal shards', crystals], ['Crystal spikes', crystalSpikes], ['Crystal blade', crystalBlade]] },
  { name: 'XLR8',        draw: drawXLR8,        speed: 12,  jump: 12, size: 0.95,
    powers: [['Speed dash', speedDash], ['Speed tornado', tornado], ['Tail whip', tailWhip]] },
  { name: 'Grey Matter', draw: drawGreyMatter,  speed: 3,   jump: 9,  size: 0.45,
    powers: [['Super brain', superBrain], ['Frog leap', frogLeap]] },
  { name: 'Four Arms',   draw: drawFourArms,    speed: 5, jump: 10, size: 1.3,
    powers: [['Ground smash', groundSmash], ['Thunder clap', thunderClap], ['Super jump slam', jumpSlam]] },
  { name: 'Stinkfly',    draw: drawStinkfly,    speed: 6,   jump: 10, size: 0.95, fly: true,
    powers: [['Slime spit', slime], ['Sticky slime trap', stinkCloud], ['Stinger', stinger]] },
  { name: 'Ripjaws',     draw: drawRipjaws,     speed: 3,   jump: 11, size: 1.05,
    powers: [['Mega chomp', chomp], ['Shark dive', sharkDive], ['Lure flash', lureFlash]] },
  { name: 'Upgrade',     draw: drawUpgrade,     speed: 5,   jump: 12, size: 1.0,
    powers: [['Merge & control', merge], ['Eye plasma beam', laser], ['Tech merge cannon', megaBlast], ['Goo stretch punch', stretchPunch]] },
  { name: 'Ghostfreak',  draw: drawGhostfreak,  speed: 5,   jump: 10, size: 1.05, fly: true,
    powers: [['Go invisible', vanish], ['Ghost tentacles', tentacles], ['Possess', merge]] },
  { name: 'Cannonbolt',  draw: drawCannonbolt,  speed: 4,   jump: 11, size: 1.1,
    powers: [['Cannonball roll', roll], ['Mega bounce', megaBounce]] },
  { name: 'Wildvine',    draw: drawWildvine,    speed: 5,   jump: 13, size: 1.05,
    powers: [['Fruit bombs', seedBombs], ['Smoke fruit bomb', smokeBomb], ['Vine whip', vineWhip], ['Vine swing', vineSwing]] },
  { name: 'Upchuck',     draw: drawUpchuck,     speed: 4,   jump: 10, size: 0.8,
    powers: [['Tongue grab: eat it!', eat], ['Spit explosive goo', spitGoo]] },
];
// Like the show: an alien lasts 10 minutes, then the watch turns red and has to recharge.
const HERO_MS = 10 * 60 * 1000;
const RECHARGE_MS = 5 * 1000;

const hero = { x: 120, y: GROUND, z: 40, vy: 0, face: 1, alien: null, until: 0, recharge: 0, dial: 0, walk: 0,
  cool: 0, dash: 0, dashV: 0, rolling: 0, ghost: 0, hurtUntil: 0, pw: 0, ammo: 0, slam: 0, chompOnLand: 0, merged: null };
const keys = {};

// W / WATCH: press once to see all the aliens and pick one, press again to go hero.
// As an alien, press it to change back.
function useWatch() {
  if (hero.alien) return changeBack(false);
  if (Date.now() < hero.recharge) return;
  if (!menu.open) openMenu(); else chooseAlien();
}

// Ctrl: turn the dial to pick an alien, or change back if already an alien.
function dial() {
  if (hero.alien) return changeBack(false);
  hero.dial = (hero.dial + 1) % ALIENS.length;
}

function changeBack(timedOut) {
  unmerge();
  hero.alien = null;
  hero.dash = hero.rolling = hero.ghost = hero.slam = hero.chompOnLand = hero.ammo = 0;
  if (timedOut) hero.recharge = Date.now() + RECHARGE_MS;
  flash = 20;
}

// The watch glows green, blinks red in the last 10 seconds, and stays red while recharging.
function omni() {
  const now = Date.now();
  if (now < hero.recharge) return '#ff3030';
  if (hero.alien && hero.until - now < 10000) return Math.floor(now / 250) % 2 ? '#ff3030' : '#39ff6a';
  return '#39ff6a';
}

const ACTIONS = { watch: useWatch, dial, power: usePower, swap: swapPower, all: allAliens, mutate: toggleMutate };
// Keyboard: arrows move, Space jumps, Shift is the watch, Ctrl turns the dial,
// Insert (the 0/Ins key) uses a power, 1 swaps powers and Enter calls ALL the aliens.
// The old letter keys still work too.
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'back', ArrowDown: 'front', ' ': 'jump', j: 'jump', J: 'jump',
  Shift: 'watch', Control: 'dial', m: 'mutate', M: 'mutate', '2': 'mutate', Insert: 'power', Numpad0: 'power', '0': 'power', '1': 'swap', Enter: 'all',
  w: 'watch', W: 'watch', p: 'power', P: 'power', o: 'swap', O: 'swap', a: 'all', A: 'all' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key] || KEYMAP[e.code];
  if (e.key === 'r' || e.key === 'R') { e.preventDefault(); return askRestart(); }
  if (e.key === 'Escape' && (!menu.open || stopped) || e.key === 'Pause' || e.key === 'Backspace') { e.preventDefault(); return toggleStop(); }
  if (stopped) return;
  if (menu.open) {
    if (k || e.key === 'Escape') { e.preventDefault(); if (!e.repeat) menuKey(e, k); }
    return;
  }
  if (!k) return;
  e.preventDefault();
  if (ACTIONS[k]) { if (!e.repeat) ACTIONS[k](); } else keys[k] = true;
  if (k === 'jump') hero.wantJump = true; // so even a quick tap jumps
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key] || KEYMAP[e.code];
  if (k) keys[k] = false;
});
document.querySelectorAll('[data-key]').forEach(b => {
  const k = b.dataset.key;
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (stopped) return;
    if (menu.open) { menuKey(e, k); return; }
    if (ACTIONS[k]) ACTIONS[k](); else keys[k] = true;
    if (k === 'jump') hero.wantJump = true;
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => keys[k] = false));
});

let flash = 0;

function clock(ms) {
  const sec = Math.ceil(ms / 1000);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function update() {
  if (menu.open) return updateMenu(); // the game waits while you pick an alien
  const a = hero.alien;
  const m = hero.merged && MERGE[kindOf(hero.merged)];
  const speed = m ? m.speed : a ? a.speed : 4, jump = m ? m.jump : a ? a.jump : 11;
  let moving = false;
  if (keys.left)  { hero.x -= speed; hero.face = -1; moving = true; }
  if (keys.right) { hero.x += speed; hero.face = 1;  moving = true; }
  if (keys.back)  { hero.z = Math.min(DEPTH, hero.z + speed * 0.6); moving = true; }
  if (keys.front) { hero.z = Math.max(0, hero.z - speed * 0.6); moving = true; }
  hero.x = Math.max(50, Math.min(WORLD - 50, hero.x));
  if (keys.jump && a && a.fly && !m) hero.vy = Math.max(hero.vy - 1.2, -6); // flyers keep going up
  else if ((keys.jump || hero.wantJump) && hero.y >= GROUND) hero.vy = -jump;
  hero.wantJump = false;
  hero.vy += 0.6;
  hero.y = Math.max(170, Math.min(GROUND, hero.y + hero.vy));
  if (hero.y >= GROUND) hero.vy = 0;
  hero.walk = moving ? hero.walk + 0.25 : 0;

  const now = Date.now();
  updatePowers(now);
  updateEnemies(now);
  cam = Math.max(0, Math.min(WORLD - W, hero.x - W / 2));
  if (a && now >= hero.until) changeBack(true);
  if (flash) flash--;

  if (hero.merged) hud.textContent = `${a.name} is ${a.name === 'Ghostfreak' ? 'possessing' : 'controlling'} the ${MERGE[kindOf(hero.merged)].name}! · Ins: shoot · 1: jump out · ${clock(hero.until - now)} left`;
  else if (hero.alien) hud.textContent = `${a.name} · Ins: ${a.powers[hero.pw][0]} (${hero.pw + 1}/${a.powers.length}) · 1 swaps${a.powers.some(p => p[1] === eat) ? ` · goo: ${hero.ammo}` : ''} · ${clock(hero.until - now)} left`;
  else if (now < hero.recharge) hud.textContent = `Watch recharging… ${Math.ceil((hero.recharge - now) / 1000)}s`;
  else hud.textContent = `Benjji · alien ${hero.dial + 1}/${ALIENS.length}: ${ALIENS[hero.dial].name} · Shift: pick an alien · Space jump · Enter: ALL`;
}

// The hourglass symbol: two green triangles meeting in the middle.
function hourglass(cx, cy, r, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, -r * 0.6); ctx.lineTo(r * 0.8, -r * 0.6); ctx.lineTo(0, 0);
  ctx.moveTo(-r * 0.8,  r * 0.6); ctx.lineTo(r * 0.8,  r * 0.6); ctx.lineTo(0, 0);
  ctx.fill();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = Math.max(1, r * 0.2);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

const SCALE = 1.9; // how big the characters are on screen
const SKIN = '#f3c9a0', LINE = '#2a1a10';

// A thick rounded limb with a dark outline.
function seg(x1, y1, x2, y2, w, color) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = LINE; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function shape(fill, build) {
  ctx.beginPath(); build(); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.stroke();
}

// A cartoon hand: palm, four finger bumps and a thumb.
function hand(x, y, angle, skin) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  shape(skin, () => ctx.ellipse(0, 0, 5.5, 5, 0, 0, Math.PI * 2));
  for (let i = 0; i < 4; i++) shape(skin, () => ctx.ellipse(5, -3.6 + i * 2.4, 2.6, 1.5, 0, 0, Math.PI * 2));
  shape(skin, () => ctx.ellipse(1, -5.5, 1.8, 3, -0.5, 0, Math.PI * 2));
  ctx.restore();
}

function sneaker(x, y) {
  shape('#1c1c1c', () => { ctx.moveTo(x - 7, y - 1); ctx.quadraticCurveTo(x - 6, y - 9, x + 2, y - 8); ctx.quadraticCurveTo(x + 11, y - 6, x + 11, y - 1); });
  shape('#f2f2f2', () => ctx.rect(x - 8, y - 2, 20, 3));
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 2, y - 7); ctx.lineTo(x + 3, y - 4); ctx.stroke();
}

function drawBenjji(x, y) {
  const s = hero.y < GROUND ? 0 : Math.sin(hero.walk) * 9;
  const air = hero.y < GROUND;
  const breathe = Math.sin(Date.now() / 450) * 0.6;
  const SHADE = '#e0b089', HAIR = '#5a3216', HAIR_LIGHT = '#8a5530';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * SCALE, SCALE);

  // back arm (darker because it's behind him)
  seg(-12, -78, -15 - s / 3, -63, 8.5, '#e2e2dd');
  seg(-15 - s / 3, -63, -14 - s / 2, -51, 6.5, SHADE);
  hand(-14 - s / 2, -48, Math.PI / 2, SHADE);

  // legs: green cargo pants
  const backFoot = air ? -7 : -6 - s, frontFoot = air ? 8 : 6 + s;
  seg(-5, -46, backFoot, -9, 12.5, '#4a5a2d');
  sneaker(backFoot, 0);
  seg(5, -46, frontFoot, -9, 12.5, '#5b6e37');
  shape('#4e602f', () => ctx.rect(frontFoot / 2 + 2.5, -34, 8, 8)); // cargo pocket
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(frontFoot / 2 + 2.5, -31.5); ctx.lineTo(frontFoot / 2 + 10.5, -31.5); ctx.stroke();
  sneaker(frontFoot, 0);

  // white T-shirt with the black stripe down the middle
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-15, -82 + breathe); ctx.quadraticCurveTo(0, -87 + breathe, 15, -82 + breathe);
  ctx.lineTo(16, -48); ctx.quadraticCurveTo(0, -46, -16, -48); ctx.closePath();
  ctx.fillStyle = '#f8f8f5'; ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#e3e3de'; ctx.fillRect(-16, -86, 5, 40);           // shadow on the back side
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-3.5, -90, 7.5, 44);        // the stripe
  ctx.restore();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-15, -82 + breathe); ctx.quadraticCurveTo(0, -87 + breathe, 15, -82 + breathe);
  ctx.lineTo(16, -48); ctx.quadraticCurveTo(0, -46, -16, -48); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = '#cfcfc8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8, -70); ctx.quadraticCurveTo(11, -64, 9, -58); ctx.stroke(); // shirt fold

  // neck
  seg(1, -86, 1, -92, 8, SHADE);

  // hair at the back of his head
  shape(HAIR, () => ctx.ellipse(1, -114, 21, 19, 0, 0, Math.PI * 2));

  // round face: big head, small chin, so he looks younger
  shape(SKIN, () => {
    ctx.moveTo(-12, -116); ctx.quadraticCurveTo(-14, -96, 2, -91);
    ctx.quadraticCurveTo(18, -90, 22, -104); ctx.quadraticCurveTo(24, -116, 18, -122);
    ctx.lineTo(-8, -124);
  });
  shape(SKIN, () => ctx.ellipse(-10, -108, 4, 5.5, 0, 0, Math.PI * 2)); // ear
  ctx.strokeStyle = SHADE; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(-10, -108, 2, -1, 1.5); ctx.stroke();

  // big green eyes with a thick top line
  [[7, 4.6, 5.6], [17.5, 3.8, 5]].forEach(([ex, rx, ry]) => {
    shape('#fff', () => ctx.ellipse(ex, -108, rx, ry, 0, 0, Math.PI * 2));
    ctx.fillStyle = '#2f9e44'; ctx.beginPath(); ctx.arc(ex + 1.2, -107.5, rx * 0.72, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7fd36a'; ctx.beginPath(); ctx.arc(ex + 1.2, -106.5, rx * 0.4, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#0d0d0d'; ctx.beginPath(); ctx.arc(ex + 1.4, -107.5, rx * 0.33, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 2.4, -109.5, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ex, -108, rx, ry, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  });
  // thick, sure-of-himself eyebrows
  ctx.strokeStyle = '#3d220e'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2, -115.5); ctx.quadraticCurveTo(7, -118, 11, -116.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14.5, -116.5); ctx.quadraticCurveTo(18, -118, 21, -116); ctx.stroke();
  // small nose and a cheeky half smile
  ctx.strokeStyle = '#b07a55'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(21.5, -104); ctx.quadraticCurveTo(23.5, -101, 20.5, -100); ctx.stroke();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(10, -96.5); ctx.quadraticCurveTo(15, -94, 19.5, -98.5); ctx.stroke();
  ctx.fillStyle = 'rgba(230,120,110,0.25)';
  ctx.beginPath(); ctx.ellipse(5, -100, 3.5, 2, 0, 0, Math.PI * 2); ctx.fill(); // rosy cheek

  // his famous hair: thick on top, bangs swooping forward over the forehead
  shape(HAIR, () => {
    ctx.moveTo(-19, -104); ctx.quadraticCurveTo(-24, -126, -6, -134);
    ctx.quadraticCurveTo(12, -139, 22, -130); ctx.quadraticCurveTo(28, -124, 27, -114);
    ctx.lineTo(22, -119); ctx.lineTo(20, -112); ctx.lineTo(15, -119);
    ctx.lineTo(11, -113); ctx.lineTo(7, -120); ctx.lineTo(2, -116);
    ctx.lineTo(-2, -121); ctx.quadraticCurveTo(-8, -114, -8, -104);
    ctx.quadraticCurveTo(-13, -100, -19, -104);
  });
  ctx.strokeStyle = HAIR_LIGHT; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-14, -126); ctx.quadraticCurveTo(0, -134, 14, -130);
  ctx.moveTo(-4, -126); ctx.quadraticCurveTo(10, -129, 20, -122);
  ctx.stroke();

  // front arm, bent forward to show off the watch on his wrist
  seg(11, -78, 15, -64, 8.5, '#f8f8f5');
  seg(15, -64, 29, -59, 6.5, SKIN);
  hand(33, -58, -0.3, SKIN);
  // the watch: chunky black and white band, round grey dial, green hourglass
  shape('#1e1e1e', () => ctx.rect(21.5, -64.5, 9, 11));
  shape('#e8e8e8', () => ctx.rect(21.5, -63, 9, 2.5));
  shape('#9aa0a6', () => ctx.arc(26, -59, 7.5, 0, Math.PI * 2));
  hourglass(26, -59, 5.5, omni());

  ctx.restore();
}

// Each alien is drawn facing right with its feet at y = 0, like Benjji.
function drawAlien(x, y, a) {
  const t = Date.now() / 120;
  const s = hero.y < GROUND ? 0 : Math.sin(hero.walk) * 9;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * a.size * SCALE, a.size * SCALE);
  a.draw(s, t);
  ctx.restore();
}

  ctx.strokeStyle = stripe; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-12, -86); ctx.quadraticCurveTo(-4, -76, -10, -60);
  ctx.moveTo(12, -84); ctx.quadraticCurveTo(4, -72, 10, -58);
  ctx.moveTo(-6, -44); ctx.quadraticCurveTo(0, -30, -4, -18);
  ctx.stroke();
  hourglass(-5, -66, 6, omni());
  // head with one big eye
  shape(pale, () => ctx.ellipse(4, -106, 15, 17, 0, 0, Math.PI * 2));
  ctx.strokeStyle = stripe; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8, -118); ctx.quadraticCurveTo(0, -110, -6, -98); ctx.stroke();
  shape('#ffffff', () => ctx.ellipse(10, -108, 7, 6, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#c2448a'; ctx.beginPath(); ctx.arc(11, -108, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(11.5, -108, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = stripe; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(6, -97); ctx.lineTo(16, -98); ctx.stroke();
  seg(12, -84, 26, -70, 7, pale);
  for (let i = 0; i < 3; i++) seg(26, -70, 33, -74 + i * 4, 2, pale);

// ---- Powers ----
const shots = [], effects = [], bits = [];
const rocks = [];
for (let x = 480, i = 0; x < WORLD - 250; x += 230 + (i * 97) % 140, i++) {
  const z = (i * 41) % 90 + 5;
  if (i % 3 === 0) rocks.push({ x, z, h: 60 + (i * 13) % 30, w: 50, back: 0 });
  else if (i % 3 === 1) rocks.push({ x, z, h: 50 + (i * 7) % 10, w: 36, back: 0, metal: true });
  else rocks.push({ x, z, h: 40, w: 40, back: 0, box: true });
}
let shake = 0;

// O / SWAP: switch to the alien's next power.
function swapPower() {
  if (hero.merged) return unmerge();
  if (hero.alien) hero.pw = (hero.pw + 1) % hero.alien.powers.length;
}

// P / POWER: use the current alien's power.
function usePower() {
  const a = hero.alien, now = Date.now();
  if (!a || now < hero.cool) return;
  hero.cool = now + 400;
  const before = shots.length, beforeFx = effects.length;
  if (hero.merged) mergedShot(now);
  else {
    const k = a.size * SCALE, f = hero.face;
    a.powers[hero.pw][1](hero.x + f * 30 * k, hero.y - 45 * k, f, k, now);
  }
  stampDepth(before, beforeFx, hero.z);
  aimShots(shots.slice(before));
}

// New shots and effects happen at the depth of whoever made them.
function stampDepth(before, beforeFx, z) {
  shots.slice(before).forEach(p => { if (p.z === undefined) p.z = z; });
  effects.slice(beforeFx).forEach(e => { if (e.z === undefined) e.z = z; });
}

// Straight shots aim at the nearest bad guy in front of the hero.
function aimShots(list) {
  const aimable = list.filter(p => !p.fall && ['fire', 'crystal', 'laser', 'plasma', 'wave'].includes(p.kind));
  if (!aimable.length) return;
  const p0 = aimable[0], dir = Math.sign(p0.vx);
  const target = enemies.filter(e => Math.sign(e.x - p0.x) === dir)
    .sort((a, b) => Math.hypot(a.x - p0.x, (a.z - p0.z) * 3) - Math.hypot(b.x - p0.x, (b.z - p0.z) * 3))[0];
  if (!target) return;
  const ty = target.type === 'drone' ? target.y : target.y - 110;
  const dx = target.x - p0.x, dy = ty - p0.y, d = Math.hypot(dx, dy) || 1;
  const baseVy = p0.vy;
  aimable.forEach(p => {
    const speed = Math.hypot(p.vx, p.vy);
    p.vy = dy / d * speed + (p.vy - baseVy);
    p.vx = dx / d * speed;
    p.vz = (target.z - p.z) / (d / speed); // and across the street, to the bad guy's depth
  });
}

function fireballs(x, y, f) { shots.push({ kind: 'fire', x, y, vx: f * 10, vy: 1, r: 9, life: 90 }); }
function crystals(x, y, f) { for (let i = -1; i <= 1; i++) shots.push({ kind: 'crystal', x, y, vx: f * 11, vy: 1 + i * 1.5, r: 6, life: 70 }); }
function slime(x, y, f) { shots.push({ kind: 'slime', x, y: y - 30, vx: f * 8, vy: -2, r: 8, life: 120, fall: 0.25 }); }
function laser(x, y, f, k) { shots.push({ kind: 'laser', x: hero.x + f * 16 * k, y: hero.y - 106 * k, vx: f * 20, vy: 2.5, r: 4, life: 45, pierce: true }); }
function seedBombs(x, y, f) { shots.push({ kind: 'seed', x, y, vx: f * 6, vy: -8, r: 6, life: 200, fall: 0.4, boom: true }); }
function smokeBomb(x, y, f) { shots.push({ kind: 'seed', x, y, vx: f * 6, vy: -8, r: 6, life: 200, fall: 0.4, smoke: true }); }
function pounce(x, y, f, k, now) { hero.vy = -14; hero.dash = now + 600; hero.dashV = f * 11; }
function speedDash(x, y, f, k, now) { hero.dash = now + 450; hero.dashV = f * 26; }
function roll(x, y, f, k, now) { hero.rolling = now + 3000; }
function vanish(x, y, f, k, now) { hero.ghost = now + 5000; }
function groundSmash(x, y, f, k, now) {
  hero.vy = 0; shake = 15;
  blast(hero.x, GROUND, 170, 'quake');
  [-1, 1].forEach(d => effects.push({ kind: 'spikes', x: hero.x + d * 110, y: GROUND, color: '#8b5e34', born: Date.now(), life: 700 }));
}
function chomp(x, y, f, k) { blast(x + f * 20, y, 70, 'chomp', f); }
// Grey Matter works out the weak spot of the nearest rock, and it crumbles.
function superBrain(x, y, f, k, now) {
  effects.push({ kind: 'idea', born: now, life: 1500 });
  const target = rocks.filter(r => !r.back).sort((p, q) => rockDist(p) - rockDist(q))[0];
  if (target) setTimeout(() => smashRock(target), 700);
}

// How far a rock, barrel or box is from the hero, counting depth too.
function rockDist(r) {
  return Math.hypot(r.x + r.w / 2 - hero.x, (r.z - hero.z) * 3);
}

function smashRock(r) {
  if (r.back) return;
  r.back = Date.now() + 4000;
  for (let i = 0; i < 10; i++) bits.push({ x: r.x + r.w / 2, z: r.z, metal: r.metal, box: r.box, y: GROUND - r.h / 2, vx: (Math.random() - 0.5) * 10, vy: -Math.random() * 9, life: 60 });
}

function blast(x, y, radius, kind, f, color, z = hero.z) {
  effects.push({ kind, x, y, z, r: radius, f, color, born: Date.now(), life: kind === 'gas' ? 1200 : 400 });
  const zr = radius * 0.4 + 20;
  rocks.forEach(r => { if (Math.abs(r.x + r.w / 2 - x) < radius + r.w / 2 && y > GROUND - r.h - radius && near(r.z, z, zr)) smashRock(r); });
  if (kind !== 'gas' || color !== '#9a9a9a') blastEnemies(x, y, radius, kind === 'quake' ? 4 : 2, z);
}

function hitsRock(x, y, pad, z) {
  return rocks.find(r => !r.back && x > r.x - pad && x < r.x + r.w + pad && y > GROUND - r.h - pad && near(r.z, z, 22));
}

function updatePowers(now) {
  const a = hero.alien;
  if (a && now < hero.dash) hero.x += hero.dashV;
  if (a && now < hero.rolling) {
    hero.x += hero.face * 10;
    if (hero.x <= 50 || hero.x >= WORLD - 50) hero.face *= -1; // bounce off the edges
  }
  hero.x = Math.max(50, Math.min(WORLD - 50, hero.x));
  // Four Arms' jump slam and Ripjaws' shark dive hit when they land
  if (hero.slam && now > hero.slam && hero.y >= GROUND) { hero.slam = 0; groundSmash(); }
  if (hero.chompOnLand && now > hero.chompOnLand && hero.y >= GROUND) {
    hero.chompOnLand = 0;
    blast(hero.x + hero.face * 50, GROUND - 40, 70, 'chomp', hero.face);
  }
  // smash rocks by running, pouncing or rolling into them
  if (a && (now < hero.dash || now < hero.rolling)) {
    const r = hitsRock(hero.x, hero.y - 10, 20, hero.z);
    if (r) { smashRock(r); shake = 6; }
    const foe = enemyAt(hero.x, hero.y - 40, 30, hero.z);
    if (foe) damageEnemy(foe, 2);
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const p = shots[i];
    if (p.z === undefined) p.z = hero.z;
    p.x += p.vx; p.y += p.vy; p.vy += p.fall || 0;
    p.z = Math.max(0, Math.min(DEPTH, p.z + (p.vz || 0)));
    let dead = --p.life <= 0 || p.x < cam - 40 || p.x > cam + W + 40;
    const r = hitsRock(p.x, p.y, p.r, p.z);
    if (r) { smashRock(r); if (!p.pierce) dead = true; }
    const foe = !dead && enemyAt(p.x, p.y, p.r, p.z);
    if (foe) { damageEnemy(foe, p.kind === 'plasma' || p.kind === 'goo' ? 3 : p.kind === 'laser' && p.color ? 2 : 1); if (!p.pierce) dead = true; }
    if (p.y >= GROUND) { p.y = GROUND; dead = true; }
    if (dead) {
      if (p.boom) blast(p.x, p.y, 70, 'boom', 0, undefined, p.z);
      if (p.smoke) blast(p.x, p.y, 90, 'gas', 0, '#9a9a9a', p.z);
      shots.splice(i, 1);
    }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.x += b.vx; b.y += b.vy; b.vy += 0.5;
    if (--b.life <= 0) bits.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    if (effects[i].z === undefined) effects[i].z = hero.z;
    if (now - effects[i].born > effects[i].life) effects.splice(i, 1);
  }
  rocks.forEach(r => { if (r.back && now > r.back) r.back = 0; });
  if (shake) shake--;
}

function drawPowers(now) {
  shots.forEach(p => atDepth(p.x, p.z ?? hero.z, () => {
    if (p.kind === 'fire') {
      ctx.fillStyle = '#ff6a1a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,30,0.4)'; ctx.beginPath(); ctx.arc(p.x - p.vx, p.y, p.r * 0.8, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'crystal') {
      const d = Math.sign(p.vx);
      shape(p.color || '#3fd18a', () => { ctx.moveTo(p.x + d * 10, p.y); ctx.lineTo(p.x - d * 6, p.y - 5); ctx.lineTo(p.x - d * 6, p.y + 5); });
    } else if (p.kind === 'slime') {
      shape('#9ccf3a', () => ctx.ellipse(p.x, p.y, p.r, p.r * 0.75, 0, 0, Math.PI * 2));
    } else if (p.kind === 'laser') {
      ctx.strokeStyle = p.color || '#39ff6a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y); ctx.stroke();
      ctx.strokeStyle = '#eaffea'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y); ctx.stroke();
    } else if (p.kind === 'wave') {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 4;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(p.x - Math.sign(p.vx) * i * 12, p.y, p.r - i * 6, -0.8 + (p.vx < 0 ? Math.PI : 0), 0.8 + (p.vx < 0 ? Math.PI : 0)); ctx.stroke(); }
    } else if (p.kind === 'plasma') {
      shape('#39ff6a', () => ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2));
      ctx.fillStyle = '#eaffea'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'goo') {
      shape('#c6e84a', () => ctx.ellipse(p.x, p.y, p.r, p.r * 0.8, now / 150, 0, Math.PI * 2));
    } else if (p.kind === 'seed') {
      shape(p.smoke ? '#555555' : '#1e1e1e', () => ctx.ellipse(p.x, p.y, 6, 8, now / 100, 0, Math.PI * 2));
    }
  }));
  bits.forEach(b => atDepth(b.x, b.z ?? hero.z, () => { ctx.fillStyle = b.metal ? '#9aa3ab' : b.box ? '#b5833f' : '#8b5e34'; ctx.fillRect(b.x - 4, b.y - 4, 8, 8); }));
  effects.forEach(e => atDepth(e.x ?? hero.x, e.z ?? hero.z, () => {
    const t = (now - e.born) / e.life;
    ctx.save(); ctx.globalAlpha = 1 - t;
    if (e.kind === 'quake' || e.kind === 'boom') {
      ctx.strokeStyle = e.kind === 'quake' ? '#f2e6c9' : '#ff8a1f'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r * t + 10, (e.r * t + 10) * (e.kind === 'quake' ? 0.25 : 0.8), 0, 0, Math.PI * 2); ctx.stroke();
    } else if (e.kind === 'chomp') {
      ctx.fillStyle = '#fff';
      const open = 20 * (1 - t);
      for (let i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(e.x - 25 + i * 10, e.y - open); ctx.lineTo(e.x - 20 + i * 10, e.y - open + 12); ctx.lineTo(e.x - 15 + i * 10, e.y - open); ctx.fill();
        ctx.beginPath(); ctx.moveTo(e.x - 25 + i * 10, e.y + open); ctx.lineTo(e.x - 20 + i * 10, e.y + open - 12); ctx.lineTo(e.x - 15 + i * 10, e.y + open); ctx.fill();
      }
    } else if (e.kind === 'slash') {
      ctx.strokeStyle = e.color || '#ffffff'; ctx.lineWidth = 5;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(e.x - e.f * 10, e.y - 10 + i * 12, 30, -0.9, 0.9, false); ctx.stroke(); }
    } else if (e.kind === 'spikes') {
      const up = Math.min(1, t * 4);
      for (let i = -2; i <= 2; i++) shape(e.color || '#4fd1c5', () => { ctx.moveTo(e.x + i * 22 - 10, e.y); ctx.lineTo(e.x + i * 22, e.y - (70 - Math.abs(i) * 15) * up); ctx.lineTo(e.x + i * 22 + 10, e.y); });
    } else if (e.kind === 'tornado') {
      ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(hero.x, e.y - 20 - i * 30, 25 + i * 14, 8 + i * 2, 0, now / 80 + i, now / 80 + i + 4); ctx.stroke(); }
    } else if (e.kind === 'gas') {
      ctx.fillStyle = e.color || '#b4d84a';
      for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(e.x + Math.cos(i * 0.9) * e.r * t, e.y + Math.sin(i * 1.7) * 30, 18 + 20 * t, 0, Math.PI * 2); ctx.fill(); }
    } else if (e.kind === 'tentacles') {
      ctx.strokeStyle = '#2a2433'; ctx.lineWidth = 5;
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4, len = e.r * Math.sin(Math.PI * t);
        ctx.beginPath(); ctx.moveTo(hero.x, hero.y - 70);
        ctx.quadraticCurveTo(hero.x + Math.cos(ang + 0.5) * len * 0.6, hero.y - 70 + Math.sin(ang + 0.5) * len * 0.6, hero.x + Math.cos(ang) * len, hero.y - 70 + Math.sin(ang) * len);
        ctx.stroke();
      }
    } else if (e.kind === 'stretch' || e.kind === 'tongue') {
      const reach = Math.sin(Math.PI * t);
      const tx = e.kind === 'tongue' ? e.tx : e.x + e.f * 120, ty = e.kind === 'tongue' ? e.ty : e.y;
      ctx.strokeStyle = e.kind === 'tongue' ? '#d65a7a' : e.color; ctx.lineWidth = e.kind === 'tongue' ? 5 : 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + (tx - e.x) * reach, e.y + (ty - e.y) * reach); ctx.stroke();
    } else if (e.kind === 'vine') {
      ctx.strokeStyle = '#4f9a2e'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(hero.x, hero.y - 100); ctx.lineTo(e.x, 60); ctx.stroke();
    } else if (e.kind === 'lure') {
      ctx.fillStyle = 'rgba(255,240,140,0.6)';
      ctx.beginPath(); ctx.arc(hero.x + hero.face * 40, hero.y - 250, 40 + 200 * t, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === 'punch') {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + e.f * (20 + 30 * t), e.y - 30 + i * 20); ctx.stroke(); }
    } else if (e.kind === 'say') {
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(e.text, Math.max(cam + 200, Math.min(cam + W - 200, hero.x)), hero.y - 250);
    } else if (e.kind === 'hungry') {
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center';
      ctx.fillText('Hungry! Eat first', hero.x, hero.y - 290 - t * 20);
    } else if (e.kind === 'idea') {
      const bx = hero.x + hero.face * 10, by = hero.y - 110;
      shape('#ffffff', () => ctx.ellipse(bx, by, 34, 20, 0, 0, Math.PI * 2));
      shape('#ffe14d', () => ctx.arc(bx - 14, by - 2, 7, 0, Math.PI * 2));
      ctx.fillStyle = '#222'; ctx.font = 'bold 12px system-ui'; ctx.fillText('E=mc²', bx - 4, by + 4);
    }
    ctx.restore();
  }));
}

// Upchuck's long tongues grab the nearest rock or metal barrel and he eats it.

function eat(x, y, f, k, now) {

    .sort((p, q) => rockDist(p) - rockDist(q))[0];

}
function spitGoo(x, y, f) {

// ---- Upgrade's merge (and Ghostfreak's possess): go inside a box, barrel or rock and control it ----
const MERGE = {
  box:    { name: 'laser box',     speed: 5, jump: 12 },
  barrel: { name: 'barrel cannon', speed: 7, jump: 10 },
  rock:   { name: 'rock tank',     speed: 3, jump: 8 },
};
const kindOf = r => r.metal ? 'barrel' : r.box ? 'box' : 'rock';

function merge(x, y, f, k, now) {
  const target = rocks.filter(r => !r.back && Math.abs(r.x + r.w / 2 - hero.x) < 130 && near(r.z, hero.z, 35))
    .sort((p, q) => rockDist(p) - rockDist(q))[0];
  if (!target) { effects.push({ kind: 'say', text: 'Get closer to a box, barrel or rock!', born: now, life: 1500 }); return; }
  effects.push({ kind: 'stretch', x, y, f: Math.sign(target.x + target.w / 2 - hero.x) || f, born: now, life: 300, color: '#141414' });
  setTimeout(() => {
    if (!hero.alien || target.back) return;
    target.back = Infinity; // it's with Upgrade now
    hero.merged = target;
    hero.x = target.x + target.w / 2;
    hero.z = target.z;
    flash = 10;
  }, 250);
}

// O / SWAP while merged: jump back out and leave the thing where it is.
function unmerge() {
  const r = hero.merged;
  if (!r) return;
  r.x = Math.max(0, Math.min(WORLD - r.w, hero.x - r.w / 2));
  r.z = hero.z;
  r.back = 0;
  hero.merged = null;
  hero.x = Math.min(WORLD - 50, hero.x + hero.face * (r.w / 2 + 25));
  hero.y = GROUND;
  flash = 10;
}

// P while merged: each thing shoots in its own way.
function mergedShot(now) {
  const r = hero.merged, f = hero.face, x = hero.x + f * r.w / 2, y = hero.y - r.h / 2;
  const kind = kindOf(r);
  if (kind === 'barrel') { shake = 5; shots.push({ kind: 'plasma', x, y, vx: f * 11, vy: 0.5, r: 12, life: 90, boom: true }); }
  else if (kind === 'box') { [-8, 8].forEach(dy => shots.push({ kind: 'laser', x, y: y + dy, vx: f * 20, vy: 0.6, r: 4, life: 45, pierce: true })); }
  else { shots.push({ kind: 'crystal', color: '#8b5e34', x, y, vx: f * 10, vy: -2, r: 9, life: 90, fall: 0.2 }); }
}

function drawMerged(now) {
  const r = hero.merged, x = hero.x - r.w / 2, y = hero.y - r.h;
  drawThing(r, x, y);
  const ghost = hero.alien.name === 'Ghostfreak';
  // Upgrade's black and green (or Ghostfreak's ghostly white) covering the whole thing
  ctx.fillStyle = ghost ? 'rgba(230,234,240,0.5)' : 'rgba(10,10,10,0.55)'; ctx.fillRect(x, y, r.w, r.h);
  ctx.strokeStyle = ghost ? '#2a2433' : '#39ff6a'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 4, y + r.h - 4); ctx.lineTo(x + 4, y + r.h / 2); ctx.lineTo(x + r.w / 2, y + r.h / 2 - 6);
  ctx.moveTo(x + r.w - 4, y + 6); ctx.lineTo(x + r.w - 4, y + r.h - 10); ctx.lineTo(x + r.w / 2, y + r.h - 10);
  ctx.stroke();
  // his one big eye, looking the way he's going
  const ex = hero.x + hero.face * r.w * 0.18, ey = y + Math.min(16, r.h * 0.3);
  ctx.fillStyle = ghost ? '#ffffff' : '#39ff6a'; ctx.beginPath(); ctx.arc(ex, ey, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ghost ? '#c2448a' : '#141414'; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ghost ? '#111' : '#39ff6a'; ctx.beginPath(); ctx.arc(ex + hero.face * 1.5, ey, 2.2, 0, Math.PI * 2); ctx.fill();
  hourglass(hero.x, y + r.h * 0.65, 6, omni());
}

function drawThing(r, x, y) {
  if (r.metal) {
    ctx.fillStyle = '#8a939b'; ctx.fillRect(x, y, r.w, r.h);
    ctx.fillStyle = '#5f676e'; ctx.fillRect(x, y + 10, r.w, 5); ctx.fillRect(x, y + r.h - 18, r.w, 5);
    ctx.fillStyle = '#b8c0c7'; ctx.fillRect(x + 6, y + 3, 5, r.h - 6);
  } else if (r.box) {
    ctx.fillStyle = '#b5833f'; ctx.fillRect(x, y, r.w, r.h);
    ctx.strokeStyle = '#7a5424'; ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, r.w - 3, r.h - 3);
    ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + r.w - 3, y + r.h - 3); ctx.moveTo(x + r.w - 3, y + 3); ctx.lineTo(x + 3, y + r.h - 3); ctx.stroke();
  } else {
    ctx.fillStyle = '#8b5e34'; ctx.fillRect(x, y, r.w, r.h);
  }
}

// ---- Bad guys: Vilgax's robot drones, and Vilgax himself ----
const enemies = [], enemyShots = [];
const game = { score: 0, nextSpawn: Date.now() + 3000, nextVilgax: 8, over: 0, level: 0, levelStart: 0, between: 0 };
const MAX_HP = 10;
// Five levels, each a little harder. Beat enough drones and Vilgax shows up; beat him to finish the level.
const LEVELS = [
  { name: 'Sunset in Bellwood', sky: ['#1b2a4a', '#e98a5a'], dronesToBoss: 8,
    droneHp: 1, droneShootMs: 3500, laserSpeed: 4, maxDrones: 3, spawnMs: 4000,
    vilgaxHp: 12, vilgaxPunch: 1, vilgaxSpeed: 1.2, safeMs: 1500, heartChance: 0.4 },
  { name: 'Bellwood at Night', sky: ['#05081a', '#1d2a55'], dronesToBoss: 10,
    droneHp: 1, droneShootMs: 3000, laserSpeed: 4.5, maxDrones: 4, spawnMs: 3500,
    vilgaxHp: 18, vilgaxPunch: 1, vilgaxSpeed: 1.4, safeMs: 1400, heartChance: 0.35 },
  { name: 'Morning Attack', sky: ['#3d8fd6', '#cfeeff'], dronesToBoss: 12,
    droneHp: 2, droneShootMs: 2700, laserSpeed: 5, maxDrones: 4, spawnMs: 3200,
    vilgaxHp: 24, vilgaxPunch: 2, vilgaxSpeed: 1.5, safeMs: 1200, heartChance: 0.3 },
  { name: 'Thunderstorm', sky: ['#1e222b', '#4f5664'], dronesToBoss: 14, rain: true,
    droneHp: 2, droneShootMs: 2300, laserSpeed: 5.5, maxDrones: 5, spawnMs: 2800,
    vilgaxHp: 30, vilgaxPunch: 2, vilgaxSpeed: 1.6, safeMs: 1100, heartChance: 0.3 },
  { name: "Vilgax's Final Attack", sky: ['#2a0505', '#d6402a'], dronesToBoss: 16,
    droneHp: 3, droneShootMs: 2000, laserSpeed: 6, maxDrones: 5, spawnMs: 2500,
    vilgaxHp: 40, vilgaxPunch: 2, vilgaxSpeed: 1.8, safeMs: 1000, heartChance: 0.3 },
];
let LEVEL = LEVELS[0];

function startLevel(i) {
  game.level = Math.min(i, LEVELS.length - 1);
  LEVEL = LEVELS[game.level];
  enemies.length = 0; enemyShots.length = 0;
  hero.hp = MAX_HP;
  game.levelStart = game.score;
  game.nextVilgax = game.score + LEVEL.dronesToBoss;
  game.nextSpawn = Date.now() + 3000;
  game.between = 0;
  banner(`LEVEL ${game.level + 1}: ${LEVEL.name}`);
}

function levelComplete() {
  const last = game.level === LEVELS.length - 1;
  banner(last ? 'YOU SAVED BELLWOOD!' : `LEVEL ${game.level + 1} COMPLETE!`);
  game.between = Date.now() + 3500; // a short break before the next level
  enemyShots.length = 0;
}
const pickups = [];
hero.hp = MAX_HP;

function banner(text) {
  for (let i = effects.length - 1; i >= 0; i--) if (effects[i].kind === 'banner') effects.splice(i, 1); // one at a time
  effects.push({ kind: 'banner', text, born: Date.now(), life: 2500 });
}

function spawnDrone() {
  const left = Math.random() < 0.5;
  enemies.push({ type: 'drone', x: left ? cam - 30 : cam + W + 30, y: 170 + Math.random() * 110, z: Math.random() * DEPTH, hp: LEVEL.droneHp, maxHp: LEVEL.droneHp,
    cool: Date.now() + 2500 + Math.random() * 1500, hurt: 0, phase: Math.random() * 6 });
}

function spawnVilgax() {
  const side = hero.x + W / 2 + 60 < WORLD ? 1 : -1;
  enemies.push({ type: 'vilgax', x: hero.x + side * (W / 2 + 60), y: GROUND, z: hero.z, hp: LEVEL.vilgaxHp, maxHp: LEVEL.vilgaxHp, cool: Date.now() + 2500, hurt: 0, face: -side });
  banner('VILGAX IS HERE!');
}

// How big the hero is right now, for getting hit.
function heroBox() {
  if (hero.merged) return { x: hero.x, w: hero.merged.w / 2 + 4, top: hero.y - hero.merged.h };
  const k = (hero.alien ? hero.alien.size : 1) * SCALE;
  return { x: hero.x, w: 20 * k, top: hero.y - 120 * k };
}

function hurtHero(dmg, fromX) {
  const now = Date.now();
  if (now < army.until) return; // the whole alien army has your back
  if (now < hero.hurtUntil || now < game.over) return;
  if (hero.alien && (now < hero.ghost || now < hero.rolling)) return; // invisible or rolled up in armour
  hero.hp -= dmg;
  hero.hurtUntil = now + LEVEL.safeMs;
  hero.vy = -5;
  hero.x += (hero.x < fromX ? -1 : 1) * 25;
  shake = 8;
  if (hero.hp <= 0) {
    game.over = now + 3000;
    banner('GAME OVER');
  }
}

function enemyAt(x, y, pad, z) {
  return enemies.find(e => near(e.z, z, 22 + pad * 0.3) && (e.type === 'drone'
    ? Math.hypot(e.x - x, e.y - y) < 24 + pad
    : Math.abs(e.x - x) < 40 + pad && y > e.y - 230 - pad && y < e.y + pad));
}

function damageEnemy(e, dmg) {
  const now = Date.now();
  if (now < e.hurt) return;
  e.hp -= dmg;
  e.hurt = now + 200;
  if (e.hp > 0) return;
  enemies.splice(enemies.indexOf(e), 1);
  for (let i = 0; i < 12; i++) bits.push({ x: e.x, z: e.z, y: e.type === 'drone' ? e.y : e.y - 100, metal: true, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 10, life: 60 });
  effects.push({ kind: 'boom', x: e.x, z: e.z, y: e.type === 'drone' ? e.y : e.y - 100, r: e.type === 'drone' ? 60 : 160, born: now, life: 500 });
  if (e.type === 'vilgax') { game.score += 10; levelComplete(); }
  else game.score++;
  // bad guys sometimes drop a heart (Vilgax always drops three)
  const drops = e.type === 'vilgax' ? 3 : Math.random() < LEVEL.heartChance ? 1 : 0;
  for (let i = 0; i < drops; i++) pickups.push({ x: e.x + (i - 1) * 40, z: e.z, y: e.type === 'drone' ? e.y : e.y - 100, vy: -3 });
}

// Every blast and contact attack hurts bad guys in range.
function blastEnemies(x, y, radius, dmg, z) {
  enemies.slice().forEach(e => {
    const ey = e.type === 'drone' ? e.y : e.y - 100;
    if (Math.abs(e.x - x) < radius + 30 && near(e.z, z, radius * 0.4 + 25) && Math.abs(ey - y) < radius + (e.type === 'drone' ? 30 : 110)) damageEnemy(e, dmg);
  });
}

// After GAME OVER you try the same level again; RESTART goes back to level 1.
function resetGame(level = game.level) {
  enemies.length = 0; enemyShots.length = 0; pickups.length = 0;
  changeBack(false);
  hero.hp = MAX_HP; hero.x = 120; hero.y = GROUND; hero.z = 40; hero.recharge = 0;
  game.over = 0;
  if (level === 0) game.score = 0;
  else game.score = game.levelStart;
  startLevel(level);
}

function updateEnemies(now) {
  if (game.over) { if (now > game.over) resetGame(); return; }
  if (game.between) {
    if (now > game.between) startLevel(game.level === LEVELS.length - 1 ? game.level : game.level + 1);
    else game.nextSpawn = now + 1000;
  }
  const drones = enemies.filter(e => e.type === 'drone').length;
  const boss = enemies.some(e => e.type === 'vilgax');
  if (!boss && !game.between && game.score >= game.nextVilgax) spawnVilgax();
  if (now > game.nextSpawn && drones < Math.min(LEVEL.maxDrones, 1 + Math.floor((game.score - game.levelStart) / 4))) {
    spawnDrone();
    game.nextSpawn = now + LEVEL.spawnMs;
  }
  // hearts fall to the ground and heal the hero when picked up
  for (let i = pickups.length - 1; i >= 0; i--) {
    const h = pickups[i];
    h.vy += 0.4; h.y = Math.min(GROUND - 14, h.y + h.vy);
    if (Math.abs(h.x - hero.x) < 40 && near(h.z, hero.z, 25) && hero.y > h.y - 20) {
      hero.hp = Math.min(MAX_HP, hero.hp + 1);
      pickups.splice(i, 1);
    }
  }
  const hb = heroBox(), aimY = hero.y - (hero.y - hb.top) / 2;
  enemies.forEach(e => {
    if (e.type === 'drone') {
      // hover near the hero, keeping a little distance, and shoot red lasers
      let want = hero.x + (e.x < hero.x ? -170 : 170);
      if (want < cam + 40 || want > cam + W - 40) want = hero.x - Math.sign(want - hero.x) * 170; // stay on screen
      e.x += Math.max(-5, Math.min(5, (want - e.x) * 0.03));
      e.y += Math.sin(now / 400 + e.phase) * 0.6;
      e.z += Math.max(-0.4, Math.min(0.4, (hero.z - e.z) * 0.01)); // drift slowly toward the hero's side of the street
      if (now > e.cool && e.x > cam && e.x < cam + W) {
        const dx = hero.x - e.x, dy = aimY - e.y, d = Math.hypot(dx, dy) || 1;
        enemyShots.push({ x: e.x, y: e.y + 8, z: e.z, vx: dx / d * LEVEL.laserSpeed, vy: dy / d * LEVEL.laserSpeed,
          vz: (hero.z - e.z) / (d / LEVEL.laserSpeed), life: 200 });
        e.cool = now + LEVEL.droneShootMs + Math.random() * 1500;
      }
    } else {
      // Vilgax stomps toward the hero, punches up close and fires eye lasers from far away
      e.face = hero.x < e.x ? -1 : 1;
      if (Math.abs(hero.x - e.x) > 80) e.x += e.face * LEVEL.vilgaxSpeed;
      e.z += Math.max(-0.8, Math.min(0.8, hero.z - e.z));
      if (now > e.cool) {
        if (Math.abs(hero.x - e.x) < 110 && near(hero.z, e.z, 25)) {
          effects.push({ kind: 'punch', x: e.x + e.face * 60, y: e.y - 120, z: e.z, f: e.face, born: now, life: 300 });
          if (Math.abs(hero.x - e.x) < 110 && hero.y > GROUND - 160) hurtHero(LEVEL.vilgaxPunch, e.x);
          e.cool = now + 2000;
        } else {
          const sx = e.x + e.face * 20, sy = e.y - 205;
          const dx = hero.x - sx, ddy = aimY - sy, d = Math.hypot(dx, ddy) || 1;
          enemyShots.push({ x: sx, y: sy, z: e.z, vx: dx / d * LEVEL.laserSpeed, vy: ddy / d * LEVEL.laserSpeed,
            vz: (hero.z - e.z) / (d / LEVEL.laserSpeed), life: 200 });
          e.cool = now + 3500;
        }
      }
    }
  });
  for (let i = enemyShots.length - 1; i >= 0; i--) {
    const p = enemyShots[i];
    p.x += p.vx; p.y += p.vy; p.z += p.vz;
    let dead = --p.life <= 0 || p.y > GROUND || p.x < cam - 40 || p.x > cam + W + 40;
    if (!dead && Math.abs(p.x - hb.x) < hb.w && p.y > hb.top && p.y < hero.y && near(p.z, hero.z, 18)) {
      if (hero.alien && hero.alien.reflect && !hero.merged) {
        // Diamondhead's crystal body bounces energy beams right back
        shots.push({ kind: 'laser', color: '#ff3030', x: p.x, y: p.y, z: p.z, vx: -p.vx * 1.5, vy: -p.vy * 1.5, vz: -p.vz * 1.5, r: 4, life: 60 });
      } else hurtHero(1, p.x - p.vx * 10);
      dead = true;
    }
    if (dead) enemyShots.splice(i, 1);
  }
}

function drawDrone(e, now) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (now < e.hurt) ctx.globalAlpha = 0.5;
  // jet flame
  ctx.fillStyle = '#ffb21f';
  ctx.beginPath(); ctx.moveTo(-6, 16); ctx.lineTo(0, 26 + Math.random() * 8); ctx.lineTo(6, 16); ctx.fill();
  // grey-green armoured body, side fins and one big red eye
  shape('#3d4a3f', () => { ctx.moveTo(-26, 0); ctx.lineTo(-14, -6); ctx.lineTo(-14, 6); });
  shape('#3d4a3f', () => { ctx.moveTo(26, 0); ctx.lineTo(14, -6); ctx.lineTo(14, 6); });
  shape('#5b6b5e', () => ctx.ellipse(0, 0, 18, 16, 0, 0, Math.PI * 2));
  shape('#2a332c', () => ctx.ellipse(0, 6, 16, 8, 0, 0, Math.PI));
  shape('#1a1a1a', () => ctx.ellipse(0, -2, 9, 7, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#ff2a2a'; ctx.beginPath(); ctx.arc(Math.sign(hero.x - e.x) * 2, -2, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd0d0'; ctx.beginPath(); ctx.arc(Math.sign(hero.x - e.x) * 2 + 1.5, -3.5, 1.2, 0, Math.PI * 2); ctx.fill();
  seg(0, -16, 0, -24, 2, '#3d4a3f');
  ctx.restore();
  if (e.hp < e.maxHp) {
    ctx.fillStyle = '#330000'; ctx.fillRect(e.x - 18, e.y - 34, 36, 4);
    ctx.fillStyle = '#ff3030'; ctx.fillRect(e.x - 18, e.y - 34, 36 * e.hp / e.maxHp, 4);
  }
}

function drawVilgax(e, now) {
  const step = Math.sin(now / 160) * 6;
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.face * 2.3, 2.3);
  if (now < e.hurt) ctx.globalAlpha = 0.6;
  const green = '#4f8a3a', greenDark = '#3a6a2a', armour = '#b0201a', black = '#1c1c1c';
  // legs in black armour with red boots
  seg(-8, -40, -9 - step, -6, 12, black);
  seg(8, -40, 9 + step, -6, 12, black);
  shape(armour, () => ctx.ellipse(-7 - step, -3, 9, 4, 0, 0, Math.PI * 2));
  shape(armour, () => ctx.ellipse(11 + step, -3, 9, 4, 0, 0, Math.PI * 2));
  // back arm
  seg(-20, -78, -26, -50, 10, greenDark);
  // big armoured chest: red with a black middle and a silver plate
  shape(armour, () => { ctx.moveTo(-24, -84); ctx.lineTo(24, -84); ctx.lineTo(16, -40); ctx.lineTo(-16, -40); });
  shape(black, () => ctx.rect(-8, -84, 16, 44));
  shape('#c9ced4', () => ctx.ellipse(0, -66, 7, 9, 0, 0, Math.PI * 2));
  // shoulder pads
  shape(black, () => ctx.ellipse(-20, -82, 10, 7, 0, 0, Math.PI * 2));
  shape(black, () => ctx.ellipse(20, -82, 10, 7, 0, 0, Math.PI * 2));
  // squid-like head: green, red eyes, tentacles hanging from his face
  shape(green, () => ctx.ellipse(4, -100, 13, 15, 0, 0, Math.PI * 2));
  ctx.strokeStyle = greenDark; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(2 + i * 3, -92);
    ctx.quadraticCurveTo(4 + i * 3 + Math.sin(now / 200 + i) * 3, -84, 1 + i * 3, -78); ctx.stroke();
  }
  ctx.fillStyle = '#ff2a2a';
  ctx.beginPath(); ctx.ellipse(6, -104, 3, 2, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -104, 2.5, 1.8, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#1c1c1c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, -109); ctx.lineTo(10, -107); ctx.moveTo(12, -107.5); ctx.lineTo(18, -109); ctx.stroke();
  // front arm with a big fist
  seg(20, -78, 30, -56, 11, green);
  shape(green, () => ctx.arc(32, -52, 7, 0, Math.PI * 2));
  ctx.restore();
}

function pickupItems(now, items) {
  pickups.forEach((h, i) => items.push({ z: h.z, draw: () => atDepth(h.x, h.z, () => {
    const hx = h.x, hy = h.y + Math.sin(now / 200 + i) * 2;
    ctx.fillStyle = '#ff4d5e'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hx, hy + 9);
    ctx.bezierCurveTo(hx - 15, hy - 4, hx - 7, hy - 16, hx, hy - 7);
    ctx.bezierCurveTo(hx + 7, hy - 16, hx + 15, hy - 4, hx, hy + 9);
    ctx.fill(); ctx.stroke();
  }) }));
}

function enemyItems(now, items) {
  enemies.forEach(e => items.push({ z: e.z, draw: () => atDepth(e.x, e.z, () => {
    shadow(e.x, e.type === 'drone' ? 18 : 45);
    if (e.type === 'drone') drawDrone(e, now); else drawVilgax(e, now);
  }) }));
}

function drawEnemyShots() {
  enemyShots.forEach(p => atDepth(p.x, p.z, () => {
    ctx.strokeStyle = '#ff3030'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); ctx.stroke();
    ctx.strokeStyle = '#ffd0d0'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); ctx.stroke();
  }));
}

// Health hearts, the score, Vilgax's health bar and big announcements.
function drawStatus(now) {
  effects.filter(e => e.kind === 'banner').forEach(e => {
    ctx.save(); ctx.globalAlpha = 1 - (now - e.born) / e.life;
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 6; ctx.font = 'bold 48px system-ui'; ctx.textAlign = 'center';
    ctx.strokeText(e.text, W / 2, H / 2 - 40, W - 40); ctx.fillText(e.text, W / 2, H / 2 - 40, W - 40);
    ctx.restore();
  });
  for (let i = 0; i < MAX_HP; i++) {
    const hx = 18 + i * 20, hy = 44;
    ctx.fillStyle = i < hero.hp ? '#ff4d5e' : 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(hx, hy + 5);
    ctx.bezierCurveTo(hx - 9, hy - 3, hx - 4, hy - 10, hx, hy - 4);
    ctx.bezierCurveTo(hx + 4, hy - 10, hx + 9, hy - 3, hx, hy + 5);
    ctx.fill();
  }
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px system-ui'; ctx.textAlign = 'right';
  ctx.fillText(`Bad guys beaten: ${game.score}`, W - 14, 50);
  ctx.font = 'bold 12px system-ui';
  const toBoss = Math.max(0, game.nextVilgax - game.score);
  ctx.fillText(`Level ${game.level + 1} of ${LEVELS.length}: ${LEVEL.name}`, W - 14, 68);
  ctx.fillText(enemies.some(e => e.type === 'vilgax') ? 'Beat VILGAX to finish the level!'
    : game.between ? 'Get ready...' : `${toBoss} more bad guy${toBoss === 1 ? '' : 's'} until Vilgax comes`, W - 14, 84);
  ctx.textAlign = 'left';
  const boss = enemies.find(e => e.type === 'vilgax');
  if (boss) {
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('VILGAX', W / 2, 70);
    ctx.fillStyle = '#330000'; ctx.fillRect(W / 2 - 150, 76, 300, 10);
    ctx.fillStyle = '#ff3030'; ctx.fillRect(W / 2 - 150, 76, 300 * boss.hp / boss.maxHp, 10);
    ctx.textAlign = 'left';
  }
}

// ---- The alien picker: like the real watch, the aliens pop up as green holograms ----
const menu = { open: false, pos: 0, mutate: false, mix: [] };
const holo = document.createElement('canvas');
holo.width = 300; holo.height = 360;
const holoCtx = holo.getContext('2d');

function openMenu() { menu.open = true; menu.mutate = false; menu.mix = []; menu.pos = hero.dial; keys.left = keys.right = false; }
function closeMenu() { menu.open = false; }
function turnDial(step) { hero.dial = (hero.dial + step + ALIENS.length) % ALIENS.length; }
function chooseAlien() {
  const members = menu.mutate && menu.mix.length ? menu.mix.map(i => ALIENS[i]) : [ALIENS[hero.dial]];
  closeMenu();
  hero.alien = makeMutant(members);
  hero.pw = 0;
  hero.until = Date.now() + HERO_MS;
  flash = 20;
}

// Keys while the picker is open: left/right turn the dial, the watch keys pick, Escape closes.
function menuKey(e, k) {
  if (e.key === 'Escape') return closeMenu();
  if (k === 'left') turnDial(-1);
  else if (k === 'right' || k === 'dial') turnDial(1);
  else if (k === 'mutate') toggleMutate();
  else if (menu.mutate && (k === 'power' || k === 'jump')) toggleMix(hero.dial);
  else if (menu.mutate && k === 'all') mixAll();
  else if (k === 'watch' || k === 'power' || k === 'all' || k === 'jump') chooseAlien();
}

// Tap an alien to turn the dial to it; tap the one in the middle to pick it.
canvas.addEventListener('pointerdown', e => {
  if (!menu.open) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * W / rect.width;
  const off = Math.round((x - W / 2) / MENU_GAP);
  if (off !== 0) turnDial(off);
  else if (menu.mutate) toggleMix(hero.dial);
  else chooseAlien();
});

const MENU_GAP = 150;
function updateMenu() {
  const n = ALIENS.length;
  let d = hero.dial - menu.pos;
  d = ((d % n) + n * 1.5) % n - n / 2; // the short way around the dial
  menu.pos = (menu.pos + d * 0.25 + n) % n;
  hud.textContent = menu.mutate
    ? `MUTATE: POWER (Ins) adds an alien · ALL (Enter) adds all · WATCH (Shift) to go mutant`
    : `Pick your alien! ◀ ▶ turn · WATCH (Shift) go hero · MUTATE (M) to blend aliens`;
}

function drawHologram(a, x, y, s, tint, t, purple) {
  const main = ctx;
  ctx = holoCtx;
  ctx.clearRect(0, 0, holo.width, holo.height);
  ctx.save(); ctx.translate(150, 345); ctx.scale(2.2, 2.2); a.draw(0, t); ctx.restore();
  ctx.globalCompositeOperation = 'source-atop';
  ctx.fillStyle = purple ? `rgba(170,60,255,${tint})` : `rgba(57,255,106,${tint})`; ctx.fillRect(0, 0, holo.width, holo.height);
  ctx.globalCompositeOperation = 'source-over';
  ctx = main;
  ctx.drawImage(holo, x - 150 * s, y - 345 * s, 300 * s, 360 * s);
}

function drawMenu(now) {
  const n = ALIENS.length, t = now / 120, cx = W / 2, cy = H / 2 + 60;
  ctx.fillStyle = 'rgba(5,15,8,0.9)'; ctx.fillRect(0, 0, W, H);
  // the watch dial behind the holograms
  ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 26;
  ctx.beginPath(); ctx.arc(cx, cy - 40, 150, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#39ff6a'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx, cy - 40, 137, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy - 40, 163, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(57,255,106,0.12)';
  ctx.beginPath(); ctx.moveTo(cx - 70, cy + 60); ctx.lineTo(cx + 70, cy + 60); ctx.lineTo(cx, cy - 120); ctx.fill(); // hologram beam
  // holograms, the picked one big in the middle
  const order = ALIENS.map((a, i) => {
    let off = i - menu.pos;
    off = ((off % n) + n * 1.5) % n - n / 2;
    return { a, off };
  }).filter(o => Math.abs(o.off) < 2.8).sort((p, q) => Math.abs(q.off) - Math.abs(p.off));
  order.forEach(({ a, off }) => {
    const s = 0.62 - Math.abs(off) * 0.13;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - Math.abs(off) * 0.32);
    const mixed = menu.mutate && menu.mix.includes(ALIENS.indexOf(a));
    drawHologram(a, cx + off * MENU_GAP, cy, s, Math.abs(off) < 0.5 ? 0.3 : 0.75, t, mixed);
    if (mixed) { // a purple tick over aliens in the mix
      ctx.fillStyle = '#a83cff'; ctx.beginPath(); ctx.arc(cx + off * MENU_GAP, cy - 250 * s, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath();
      ctx.moveTo(cx + off * MENU_GAP - 6, cy - 250 * s); ctx.lineTo(cx + off * MENU_GAP - 1, cy - 245 * s); ctx.lineTo(cx + off * MENU_GAP + 7, cy - 256 * s); ctx.stroke();
    }
    ctx.restore();
  });
  // name of the picked alien
  ctx.textAlign = 'center';
  ctx.fillStyle = '#39ff6a'; ctx.font = 'bold 30px system-ui';
  ctx.fillText(ALIENS[hero.dial].name, cx, H - 38);
  ctx.fillStyle = '#bfffcf'; ctx.font = 'bold 13px system-ui';
  if (!menu.mutate) ctx.fillText(`${hero.dial + 1} of ${n} · tap or press WATCH to go hero`, cx, H - 18);
  else {
    const mix = menu.mix.map(i => ALIENS[i]);
    ctx.fillStyle = '#e0b0ff';
    ctx.fillText(mix.length ? `Mix (${mix.length}): ${mix.map(m => m.name).join(' + ')}` : 'Tap the middle alien or press POWER to add it to the mix', cx, H - 18, W - 40);
    // a preview of the mutant, in colour
    if (mix.length > 1) {
      ctx.fillStyle = 'rgba(40,10,60,0.85)'; ctx.fillRect(W - 150, 50, 140, 175);
      ctx.strokeStyle = '#a83cff'; ctx.lineWidth = 2; ctx.strokeRect(W - 150, 50, 140, 175);
      drawHologram(makeMutant(mix), W - 80, 215, 0.42, 0, t);
      ctx.fillStyle = '#e0b0ff'; ctx.font = 'bold 12px system-ui';
      ctx.fillText(makeMutant(mix).name, W - 80, 66, 130);
    }
  }
  ctx.textAlign = 'left';
}

// ---- MUTATE: blend as many aliens as you like into one mutant alien ----
// The mutant's body is made of a slice of each alien (top to bottom), and it has every power they have.
function makeMutant(members) {
  if (members.length === 1) return members[0];
  const short = s => s.replace(/\s/g, '');
  const first = short(members[0].name), last = short(members[members.length - 1].name);
  let name = first.slice(0, Math.floor(first.length / 2)) + last.slice(Math.floor(last.length / 2)).toLowerCase();
  if (members.length === ALIENS.length) name = 'Ultimate Mutant';
  else if (members.length > 2) name = `Mega ${name}`;
  return {
    name, members, mutant: true,
    speed: Math.max(...members.map(m => m.speed)),
    jump: Math.max(...members.map(m => m.jump)),
    size: Math.min(1.3, Math.max(...members.map(m => m.size))),
    fly: members.some(m => m.fly),
    reflect: members.some(m => m.reflect),
    powers: members.flatMap(m => m.powers.map(([label, fn]) => [`${label} (${m.name})`, fn])),
    draw: (s, t) => drawMutant(members, s, t),
  };
}

function drawMutant(members, s, t) {
  const n = members.length, top = -150, band = 150 / n;
  // a purple mutant glow
  ctx.fillStyle = 'rgba(170,60,255,0.22)';
  ctx.beginPath(); ctx.ellipse(0, -70, 50 + Math.sin(t / 2) * 3, 85, 0, 0, Math.PI * 2); ctx.fill();
  members.forEach((m, i) => {
    ctx.save();
    ctx.beginPath(); ctx.rect(-130, top + i * band, 260, band + 0.5); ctx.clip();
    m.draw(s, t);
    ctx.restore();
  });
  // purple seams where the aliens are stitched together
  ctx.strokeStyle = 'rgba(200,120,255,0.8)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
  for (let i = 1; i < n; i++) { ctx.beginPath(); ctx.moveTo(-30, top + i * band); ctx.lineTo(30, top + i * band); ctx.stroke(); }
  ctx.setLineDash([]);
  hourglass(0, -70, 6, omni());
}

// In the picker: MUTATE turns on mixing; POWER adds or removes the alien in the middle.
function toggleMutate() {
  if (!menu.open) { if (hero.alien || Date.now() < hero.recharge) return; openMenu(); }
  menu.mutate = !menu.mutate;
  menu.mix = [];
}
function toggleMix(i) {
  const at = menu.mix.indexOf(i);
  if (at >= 0) menu.mix.splice(at, 1); else menu.mix.push(i);
}
function mixAll() {
  menu.mix = menu.mix.length === ALIENS.length ? [] : ALIENS.map((a, i) => i);
}

// ---- ALL ALIENS: every alien jumps out and uses every one of its powers ----
const army = { until: 0, born: 0, spots: [] };
const ARMY_MS = 3500;
// powers that just shoot or hit, so they work from wherever each alien stands
const ARMY_SAFE = [fireballs, flamethrower, crystals, crystalSpikes, crystalBlade, slime, stinkCloud, stinger,
  laser, megaBlast, stretchPunch, seedBombs, smokeBomb, vineWhip, roar, clawSlash, thunderClap, groundSmash,
  chomp, tentacles, tailWhip];

function allAliens() {
  const now = Date.now();
  if (now < army.until) return;
  army.born = now; army.until = now + ARMY_MS;
  army.spots = ALIENS.map((a, i) => ({ a, x: cam + 50 + i * (W - 100) / (ALIENS.length - 1), z: [15, 50, 85][i % 3], face: 1 }));
  banner('ALL ALIENS ATTACK!');
  flash = 15;
  let delay = 400;
  army.spots.forEach(spot => spot.a.powers.forEach(([, fn]) => {
    setTimeout(() => armyPower(spot, fn), delay);
    delay += 45;
  }));
  // a big finish that beats every bad guy on the screen
  setTimeout(() => {
    enemies.slice().forEach(e => { if (e.x > cam - 50 && e.x < cam + W + 50) { e.hurt = 0; damageEnemy(e, 99); } });
    shake = 20; flash = 20;
  }, ARMY_MS - 500);
}

function armyPower(spot, fn) {
  const now = Date.now();
  const target = enemies.slice().sort((p, q) => Math.hypot(p.x - spot.x, p.z - spot.z) - Math.hypot(q.x - spot.x, q.z - spot.z))[0];
  const f = target ? Math.sign(target.x - spot.x) || 1 : (spot.x < hero.x ? -1 : 1);
  spot.face = f;
  const k = 0.6 * spot.a.size * SCALE;
  // use the alien's spot for a moment, without moving the real hero
  const saved = { x: hero.x, y: hero.y, z: hero.z, face: hero.face, vy: hero.vy, dash: hero.dash, dashV: hero.dashV,
    rolling: hero.rolling, ghost: hero.ghost, slam: hero.slam, chompOnLand: hero.chompOnLand };
  hero.x = spot.x; hero.y = GROUND; hero.z = spot.z; hero.face = f;
  const before = shots.length, beforeFx = effects.length;
  if (ARMY_SAFE.includes(fn)) fn(spot.x + f * 30 * k, GROUND - 45 * k, f, k, now);
  else if (fn === spitGoo) shots.push({ kind: 'goo', x: spot.x + f * 20, y: GROUND - 50, vx: f * 9, vy: -3, r: 10, life: 120, fall: 0.25, boom: true });
  else if (target) blast(target.x, target.type === 'drone' ? target.y : target.y - 100, 50, 'slash', f, '#39ff6a', target.z); // dashes, rolls, merges...
  stampDepth(before, beforeFx, spot.z);
  aimShots(shots.slice(before));
  Object.assign(hero, saved);
}

function armyItems(now, items) {
  if (now >= army.until) return;
  const t = now / 120;
  army.spots.forEach((spot, i) => items.push({ z: spot.z, draw: () => atDepth(spot.x, spot.z, () => {
    const appear = Math.min(1, (now - army.born - i * 40) / 300);
    if (appear <= 0) return;
    shadow(spot.x, 26 * spot.a.size);
    ctx.save();
    ctx.globalAlpha = Math.min(appear, (army.until - now) / 400);
    ctx.translate(spot.x, GROUND + (1 - appear) * 40);
    const k = 0.6 * spot.a.size * SCALE;
    ctx.scale(spot.face * k, k);
    spot.a.draw(Math.sin(t / 2 + i) * 3, t);
    ctx.restore();
  }) }));
}

// ---- Bellwood: the city where it all happens. It's much wider than the screen,
// and the camera follows the hero as they walk through it. ----
const BACK = GROUND + floorShift(DEPTH); // where the street meets the sidewalk
const rand = i => { const x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); };
const SKYLINE = [];
for (let x = 0, i = 0; x < WORLD * 0.5 + W; i++) {
  const bw = 60 + rand(i) * 50;
  SKYLINE.push([x, 110 + rand(i + 50) * 160, bw]);
  x += bw;
}

function drawSky() {
  const sky = ctx.createLinearGradient(0, 0, 0, BACK);
  sky.addColorStop(0, LEVEL.sky[0]); sky.addColorStop(1, LEVEL.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, BACK + 20);
}

// The thunderstorm level has rain and lightning.
function drawWeather(now) {
  if (!LEVEL.rain) return;
  ctx.strokeStyle = 'rgba(180,200,255,0.45)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < 90; i++) {
    const x = (i * 97 + now * 0.25) % (W + 60) - 30, y = (i * 53 + now * 0.9) % H;
    ctx.moveTo(x, y); ctx.lineTo(x - 6, y + 16);
  }
  ctx.stroke();
  if (now % 7000 < 120) { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(0, 0, W, H); }
}

// Far buildings scroll slower than the street, so the city feels deep.
function drawSkyline() {
  const left = cam * 0.5 - 20, right = cam * 0.5 + W + 20;
  SKYLINE.forEach(([bx, bh, bw], i) => {
    if (bx + bw < left || bx > right) return;
    const top = BACK - 40 - bh;
    ctx.fillStyle = i % 2 ? '#2c3550' : '#363f5c';
    ctx.fillRect(bx, top, bw, bh + 40);
    ctx.fillStyle = '#ffd77a';
    for (let wy = top + 12; wy < BACK - 50; wy += 22)
      for (let wx = bx + 10; wx < bx + bw - 14; wx += 18)
        if ((Math.floor(wx) * 7 + wy * 3 + i) % 5 < 3) ctx.fillRect(wx, wy, 8, 11);
  });
}

function sign(x, w, text, bg, fg) {
  ctx.fillStyle = '#5f646c'; ctx.fillRect(x + 6, BACK - 70, 4, 30); ctx.fillRect(x + w - 10, BACK - 70, 4, 30);
  ctx.fillStyle = bg; ctx.fillRect(x, BACK - 100, w, 32);
  ctx.fillStyle = fg; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(text, x + w / 2, BACK - 79);
  ctx.textAlign = 'left';
}

function shop(x, name, color) {
  ctx.fillStyle = '#f4f1ea'; ctx.fillRect(x, BACK - 90, 120, 50);
  ctx.fillStyle = color; ctx.fillRect(x - 5, BACK - 96, 130, 10);
  ctx.fillStyle = '#9fd0ff'; ctx.fillRect(x + 10, BACK - 78, 40, 30); ctx.fillRect(x + 70, BACK - 78, 40, 30);
  ctx.fillStyle = color; ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(name, x + 60, BACK - 100);
  ctx.textAlign = 'left';
}

// Grandpa Max's RV from the show.
function rustBucket(x) {
  ctx.fillStyle = '#f2ead8'; ctx.fillRect(x, BACK - 78, 150, 52);
  ctx.fillStyle = '#c85a2a'; ctx.fillRect(x, BACK - 52, 150, 8);
  ctx.fillStyle = '#9fd0ff'; ctx.fillRect(x + 118, BACK - 72, 26, 18); ctx.fillRect(x + 20, BACK - 70, 30, 14); ctx.fillRect(x + 60, BACK - 70, 30, 14);
  ctx.fillStyle = '#1c1c1c';
  [x + 30, x + 120].forEach(wx => { ctx.beginPath(); ctx.arc(wx, BACK - 24, 12, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = '#c85a2a'; ctx.font = 'bold 11px system-ui'; ctx.fillText('RUST BUCKET', x + 8, BACK - 82);
}

function drawStreet() {
  const left = cam - 20, right = cam + W + 20;
  ctx.fillStyle = '#9a9ca3'; ctx.fillRect(left, BACK - 40, right - left, 40);
  ctx.fillStyle = '#7e8088'; for (let x = Math.floor(left / 60) * 60; x < right; x += 60) ctx.fillRect(x, BACK - 40, 2, 40);
  sign(-10, 170, 'Welcome to Bellwood', '#2f7a3a', '#ffffff');
  rustBucket(220);
  shop(1400, 'Mr. Smoothy', '#e8486a');
  shop(2600, 'Burger Shack', '#d9822b');
  sign(WORLD - 220, 170, 'Leaving Bellwood', '#2f7a3a', '#ffffff');
  ctx.fillStyle = '#3a3b40'; ctx.fillRect(left, BACK, right - left, H - BACK + 20);
  ctx.fillStyle = '#f2d14a'; for (let x = Math.floor(left / 70) * 70 + 10; x < right; x += 70) ctx.fillRect(x, GROUND - 14, 36, 5);
}

function draw() {
  const now = Date.now();
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawSky();
  ctx.save(); ctx.translate(-cam * 0.5, 0); drawSkyline(); ctx.restore();
  ctx.save(); ctx.translate(-cam, 0);
  drawStreet();
  // everything on the street, drawn from the back to the front
  const items = [];
  // rocks, barrels and boxes: powers can smash them, and they come back after a few seconds
  rocks.forEach(r => {
    if (!r.back && r.x + r.w > cam - 20 && r.x < cam + W + 20)
      items.push({ z: r.z, draw: () => atDepth(r.x + r.w / 2, r.z, () => drawThing(r, r.x, GROUND - r.h)) });
  });
  pickupItems(now, items);
  enemyItems(now, items);
  armyItems(now, items);
  items.push({ z: hero.z, draw: () => atDepth(hero.x, hero.z, () => {
    shadow(hero.x, hero.merged ? hero.merged.w * 0.6 : 26 * (hero.alien ? hero.alien.size : 1));
    if (now < hero.hurtUntil && Math.floor(now / 100) % 2) ctx.globalAlpha = 0.4; // blink when hit
    if (hero.alien) {
      ctx.save();
      if (now < hero.ghost) ctx.globalAlpha = 0.25;
      if (hero.merged) drawMerged(now); else drawAlien(hero.x, hero.y, hero.alien);
      ctx.restore();
    } else drawBenjji(hero.x, hero.y);
  }) });
  items.sort((p, q) => q.z - p.z).forEach(item => item.draw());
  drawPowers(now);
  drawEnemyShots();
  ctx.restore();
  ctx.restore();
  drawWeather(now);
  drawStatus(now);
  if (menu.open) drawMenu(now);

  if (flash) {
    ctx.fillStyle = `rgba(57,255,106,${flash / 25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ---- STOP: pause the game, and press again to keep playing ----
let stopped = false, stoppedAt = 0;
const stopBtn = document.getElementById('stopBtn');
stopBtn.addEventListener('pointerdown', e => { e.preventDefault(); toggleStop(); });
function toggleStop() {
  stopped = !stopped;
  Object.keys(keys).forEach(k => keys[k] = false);
  if (stopped) stoppedAt = Date.now();
  else {
    // move every timer forward, so nothing ran out while the game was stopped
    const d = Date.now() - stoppedAt;
    ['until', 'recharge', 'cool', 'dash', 'rolling', 'ghost', 'hurtUntil', 'slam', 'chompOnLand'].forEach(k => { if (hero[k]) hero[k] += d; });
    enemies.forEach(e => { e.cool += d; e.hurt += d; });
    effects.forEach(e => e.born += d);
    rocks.forEach(r => { if (r.back && r.back !== Infinity) r.back += d; });
    ['nextSpawn', 'over'].forEach(k => { if (game[k]) game[k] += d; });
    if (army.until) { army.until += d; army.born += d; }
  }
  stopBtn.textContent = stopped ? '▶ GO' : '⏸ STOP';
  stopBtn.classList.toggle('paused', stopped);
}

// ---- RESTART: press twice (so it can't happen by accident) to start the game again ----
const restartBtn = document.getElementById('restartBtn');
let restartAsk = 0;
restartBtn.addEventListener('pointerdown', e => { e.preventDefault(); askRestart(); });
function askRestart() {
  if (Date.now() < restartAsk) return restartGame();
  restartAsk = Date.now() + 2500;
  restartBtn.textContent = 'Sure? Tap again';
  restartBtn.classList.add('sure');
  setTimeout(() => { if (Date.now() >= restartAsk) resetRestartBtn(); }, 2600);
}
function resetRestartBtn() {
  restartAsk = 0;
  restartBtn.textContent = '↻ RESTART';
  restartBtn.classList.remove('sure');
}
function restartGame() {
  resetRestartBtn();
  if (stopped) toggleStop();
  closeMenu();
  army.until = 0;
  shots.length = 0; effects.length = 0; bits.length = 0;
  rocks.forEach(r => r.back = 0);
  effects.length = 0;
  resetGame(0);
  hero.dial = 0; hero.face = 1; hero.vy = 0; hero.hurtUntil = 0;
  flash = 20;
}

function drawStopped() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 56px system-ui';
  ctx.fillText('STOPPED', W / 2, H / 2);
  ctx.font = 'bold 16px system-ui';
  ctx.fillText('Press GO (or Esc) to keep playing', W / 2, H / 2 + 34);
  ctx.textAlign = 'left';
}

startLevel(0);

(function loop() {
  if (!stopped) { update(); draw(); } else { draw(); drawStopped(); }
  requestAnimationFrame(loop);
})();
</script>
