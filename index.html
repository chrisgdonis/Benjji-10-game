<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Benjji 10</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a10; color: #eaffea;
    font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #game { display: block; margin: 0 auto; background: #1d3b52; max-width: 100%; }
  #hud { position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-weight: 700; text-shadow: 0 2px 0 #000; pointer-events: none; }
  .pad { position: absolute; bottom: 16px; display: flex; gap: 12px; }
  .pad button { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #39ff6a;
    background: #102a17cc; color: #eaffea; font-size: 24px; font-weight: 700; }
  #left { left: 16px; }
  #right { right: 16px; }
  #watchBtn { width: 80px; height: 80px; background: #39ff6a; color: #000; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div id="hud">Benjji · Y to pick an alien, W to go hero</div>
<div class="pad" id="left">
  <button data-key="left">◀</button>
  <button data-key="right">▶</button>
</div>
<div class="pad" id="right">
  <button data-key="up">▲</button>
  <button data-key="dial">Y</button>
  <button id="watchBtn" data-key="watch">WATCH</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = canvas.width, H = canvas.height, GROUND = H - 70;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// The watch's aliens: the first ten from the show. Each one changes how Benjji moves.
const ALIENS = [
  { name: 'Heatblast',   draw: drawHeatblast,   speed: 5,   jump: 13, size: 1.0 },
  { name: 'Wildmutt',    draw: drawWildmutt,    speed: 8,   jump: 14, size: 1.0 },
  { name: 'Diamondhead', draw: drawDiamondhead, speed: 4.5, jump: 11, size: 1.05 },
  { name: 'XLR8',        draw: drawXLR8,        speed: 12,  jump: 12, size: 0.95 },
  { name: 'Grey Matter', draw: drawGreyMatter,  speed: 3,   jump: 9,  size: 0.45 },
  { name: 'Four Arms',   draw: drawFourArms,    speed: 3.5, jump: 10, size: 1.3 },
  { name: 'Stinkfly',    draw: drawStinkfly,    speed: 6,   jump: 10, size: 0.95, fly: true },
  { name: 'Ripjaws',     draw: drawRipjaws,     speed: 4,   jump: 11, size: 1.05 },
  { name: 'Upgrade',     draw: drawUpgrade,     speed: 5,   jump: 12, size: 1.0 },
  { name: 'Ghostfreak',  draw: drawGhostfreak,  speed: 5,   jump: 10, size: 1.05, fly: true },
];
// Like the show: an alien lasts 10 minutes, then the watch turns red and has to recharge.
const HERO_MS = 10 * 60 * 1000;
const RECHARGE_MS = 5 * 1000;

const hero = { x: 120, y: GROUND, vy: 0, face: 1, alien: null, until: 0, recharge: 0, dial: 0, walk: 0 };
const keys = {};

// W / WATCH: press once to go hero, press again to change back.
function useWatch() {
  if (hero.alien) return changeBack(false);
  if (Date.now() < hero.recharge) return;
  hero.alien = ALIENS[hero.dial];
  hero.until = Date.now() + HERO_MS;
  flash = 20;
}

// Y: turn the dial to pick an alien, or change back if already an alien.
function dial() {
  if (hero.alien) return changeBack(false);
  hero.dial = (hero.dial + 1) % ALIENS.length;
}

function changeBack(timedOut) {
  hero.alien = null;
  if (timedOut) hero.recharge = Date.now() + RECHARGE_MS;
  flash = 20;
}

// The watch glows green, blinks red in the last 10 seconds, and stays red while recharging.
function omni() {
  const now = Date.now();
  if (now < hero.recharge) return '#ff3030';
  if (hero.alien && hero.until - now < 10000) return Math.floor(now / 250) % 2 ? '#ff3030' : '#39ff6a';
  return '#39ff6a';
}

const ACTIONS = { watch: useWatch, dial };
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ' ': 'up', w: 'watch', W: 'watch', y: 'dial', Y: 'dial' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (ACTIONS[k]) { if (!e.repeat) ACTIONS[k](); } else keys[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (k) keys[k] = false;
});
document.querySelectorAll('[data-key]').forEach(b => {
  const k = b.dataset.key;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (ACTIONS[k]) ACTIONS[k](); else keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => keys[k] = false));
});

let flash = 0;

function clock(ms) {
  const sec = Math.ceil(ms / 1000);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function update() {
  const a = hero.alien;
  const speed = a ? a.speed : 4, jump = a ? a.jump : 11;
  let moving = false;
  if (keys.left)  { hero.x -= speed; hero.face = -1; moving = true; }
  if (keys.right) { hero.x += speed; hero.face = 1;  moving = true; }
  hero.x = Math.max(50, Math.min(W - 50, hero.x));
  if (keys.up && a && a.fly) hero.vy = Math.max(hero.vy - 1.2, -6); // flyers keep going up
  else if (keys.up && hero.y >= GROUND) hero.vy = -jump;
  hero.vy += 0.6;
  hero.y = Math.max(170, Math.min(GROUND, hero.y + hero.vy));
  if (hero.y >= GROUND) hero.vy = 0;
  hero.walk = moving ? hero.walk + 0.25 : 0;

  const now = Date.now();
  if (a && now >= hero.until) changeBack(true);
  if (flash) flash--;

  if (hero.alien) hud.textContent = `${a.name}! ${clock(hero.until - now)} left · W or Y to change back`;
  else if (now < hero.recharge) hud.textContent = `Watch recharging… ${Math.ceil((hero.recharge - now) / 1000)}s`;
  else hud.textContent = `Benjji · alien ${hero.dial + 1} of 10: ${ALIENS[hero.dial].name} · Y to pick, W to go hero!`;
}

// The hourglass symbol: two green triangles meeting in the middle.
function hourglass(cx, cy, r, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, -r * 0.6); ctx.lineTo(r * 0.8, -r * 0.6); ctx.lineTo(0, 0);
  ctx.moveTo(-r * 0.8,  r * 0.6); ctx.lineTo(r * 0.8,  r * 0.6); ctx.lineTo(0, 0);
  ctx.fill();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = Math.max(1, r * 0.2);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

const SCALE = 1.9; // how big the characters are on screen
const SKIN = '#f3c9a0', LINE = '#2a1a10';

// A thick rounded limb with a dark outline.
function seg(x1, y1, x2, y2, w, color) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = LINE; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function shape(fill, build) {
  ctx.beginPath(); build(); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.stroke();
}

// A cartoon hand: palm, four finger bumps and a thumb.
function hand(x, y, angle, skin) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  shape(skin, () => ctx.ellipse(0, 0, 5.5, 5, 0, 0, Math.PI * 2));
  for (let i = 0; i < 4; i++) shape(skin, () => ctx.ellipse(5, -3.6 + i * 2.4, 2.6, 1.5, 0, 0, Math.PI * 2));
  shape(skin, () => ctx.ellipse(1, -5.5, 1.8, 3, -0.5, 0, Math.PI * 2));
  ctx.restore();
}

function sneaker(x, y) {
  shape('#1c1c1c', () => { ctx.moveTo(x - 7, y - 1); ctx.quadraticCurveTo(x - 6, y - 9, x + 2, y - 8); ctx.quadraticCurveTo(x + 11, y - 6, x + 11, y - 1); });
  shape('#f2f2f2', () => ctx.rect(x - 8, y - 2, 20, 3));
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 2, y - 7); ctx.lineTo(x + 3, y - 4); ctx.stroke();
}

function drawBenjji(x, y) {
  const s = Math.sin(hero.walk) * 9;
  const air = hero.y < GROUND;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * SCALE, SCALE);

  // back arm (a little darker because it's behind him)
  seg(-11, -80, -13 - s / 3, -64, 8, '#dcdcd8');
  seg(-13 - s / 3, -64, -12 - s / 2, -52, 6.5, '#e2b48c');
  hand(-12 - s / 2, -49, Math.PI / 2, '#e2b48c');

  // legs: olive cargo pants
  const backFoot = air ? -6 : -6 - s, frontFoot = air ? 8 : 6 + s;
  seg(-5, -46, backFoot, -9, 12, '#46542c');
  sneaker(backFoot, 0);
  seg(5, -46, frontFoot, -9, 12, '#56673a');
  shape('#4a5a2e', () => ctx.rect(frontFoot / 2 + 3, -36, 7, 7)); // cargo pocket
  sneaker(frontFoot, 0);

  // body: white T-shirt with the black stripe down the middle
  shape('#f7f7f4', () => {
    ctx.moveTo(-15, -86); ctx.quadraticCurveTo(0, -91, 15, -86);
    ctx.lineTo(16, -46); ctx.lineTo(-16, -46);
  });
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-3, -88, 7, 42);
  ctx.fillStyle = '#e4e4df'; ctx.fillRect(-15, -84, 4, 38); // shade
  // collar
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(1, -89, 5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  // belt line
  ctx.fillStyle = '#3a4524'; ctx.fillRect(-16, -48, 32, 4);

  // neck
  seg(1, -90, 1, -95, 8, SKIN);

  // head: a bit rounder and bigger, so he looks younger
  shape(SKIN, () => ctx.ellipse(3, -113, 18, 20, 0, 0, Math.PI * 2));
  shape(SKIN, () => ctx.ellipse(-10, -111, 4, 6, 0, 0, Math.PI * 2)); // ear
  // eyes: big and green
  [[6, 4, 5], [16, 3.4, 4.4]].forEach(([ex, rx, ry]) => {
    shape('#fff', () => ctx.ellipse(ex, -114, rx, ry, 0, 0, Math.PI * 2));
    ctx.fillStyle = '#35a84a'; ctx.beginPath(); ctx.arc(ex + 1, -113.5, rx * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0d0d0d'; ctx.beginPath(); ctx.arc(ex + 1.2, -113.5, rx * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 2, -115, 0.9, 0, Math.PI * 2); ctx.fill();
  });
  // eyebrows
  ctx.strokeStyle = '#4a2a14'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, -121); ctx.lineTo(9, -122); ctx.moveTo(13, -121.5); ctx.lineTo(19, -121); ctx.stroke();
  // nose and a confident smile
  ctx.strokeStyle = '#b07a55'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(20, -110); ctx.quadraticCurveTo(22, -107, 19, -106); ctx.stroke();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(9, -101); ctx.quadraticCurveTo(14, -98, 18, -102); ctx.stroke();

  // spiky brown hair swept to the front
  shape('#5c3317', () => {
    ctx.moveTo(-15, -103); ctx.lineTo(-18, -117); ctx.lineTo(-13, -129); ctx.lineTo(-1, -136);
    ctx.lineTo(13, -134); ctx.lineTo(24, -127); ctx.lineTo(23, -119); ctx.lineTo(19, -123);
    ctx.lineTo(16, -117); ctx.lineTo(12, -123); ctx.lineTo(7, -118); ctx.lineTo(3, -124);
    ctx.lineTo(-3, -120); ctx.lineTo(-5, -110); ctx.lineTo(-9, -103);
  });
  ctx.strokeStyle = '#8a5530'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-8, -129); ctx.quadraticCurveTo(4, -134, 16, -130); ctx.stroke();

  // front arm, bent forward to show off the watch
  seg(11, -80, 15, -64, 8, '#f7f7f4');
  seg(15, -64, 29, -58, 6.5, SKIN);
  hand(33, -57, -0.3, SKIN);
  // the watch: chunky band with the hourglass face
  shape('#2b2b2b', () => ctx.rect(23, -63, 7, 10));
  shape('#7a7a7a', () => ctx.rect(22, -62, 9, 2));
  hourglass(26.5, -58, 5.5, omni());

  ctx.restore();
}

// Each alien is drawn facing right with its feet at y = 0, like Benjji.
function drawAlien(x, y, a) {
  const t = Date.now() / 120;
  const s = hero.y < GROUND ? 0 : Math.sin(hero.walk) * 9;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * a.size * SCALE, a.size * SCALE);
  a.draw(s, t);
  ctx.restore();
}

function drawHeatblast(s, t) {
  const rock = '#8e2416', rockDark = '#6a180e', glow = '#ffcf3a';
  // back arm and legs
  seg(-12, -84, -16 - s / 3, -58, 9, rockDark);
  shape('#ff8a1f', () => ctx.arc(-16 - s / 3, -54, 6, 0, Math.PI * 2));
  seg(-5, -46, -6 - s, -6, 12, rockDark);
  seg(5, -46, 6 + s, -6, 12, rock);
  // rocky body with glowing magma cracks
  shape(rock, () => {
    ctx.moveTo(-17, -88); ctx.lineTo(-6, -92); ctx.lineTo(16, -90); ctx.lineTo(19, -62);
    ctx.lineTo(12, -44); ctx.lineTo(-12, -44); ctx.lineTo(-18, -63);
  });
  ctx.strokeStyle = glow; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -80); ctx.lineTo(-8, -72); ctx.lineTo(-12, -60); ctx.lineTo(-6, -50);
  ctx.moveTo(14, -82); ctx.lineTo(9, -74); ctx.lineTo(13, -62); ctx.lineTo(8, -48);
  ctx.moveTo(-4, -46); ctx.lineTo(0, -54); ctx.lineTo(5, -46);
  ctx.moveTo(-5, -30); ctx.lineTo(-7, -20); ctx.moveTo(6, -32); ctx.lineTo(8, -18);
  ctx.stroke();
  hourglass(0, -68, 7, omni());
  // head made of fire, flickering
  const flick = i => Math.sin(t * 1.3 + i * 1.7) * 4;
  shape('#ff6a1a', () => {
    ctx.moveTo(-14, -94); ctx.lineTo(-18, -114 + flick(1)); ctx.lineTo(-10, -110);
    ctx.lineTo(-8, -134 + flick(2)); ctx.lineTo(0, -120); ctx.lineTo(6, -142 + flick(3));
    ctx.lineTo(10, -122); ctx.lineTo(20, -134 + flick(4)); ctx.lineTo(18, -112);
    ctx.lineTo(24, -104 + flick(5)); ctx.lineTo(18, -94);
  });
  shape('#ffb21f', () => {
    ctx.moveTo(-8, -96); ctx.lineTo(-8, -118 + flick(6)); ctx.lineTo(0, -110);
    ctx.lineTo(6, -128 + flick(7)); ctx.lineTo(10, -112); ctx.lineTo(16, -118 + flick(8)); ctx.lineTo(14, -96);
  });
  // face: bright eyes and a grin
  ctx.fillStyle = '#fffbe0';
  ctx.beginPath(); ctx.ellipse(5, -107, 3.5, 2, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -107, 3, 1.8, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a1c06'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(5, -100); ctx.quadraticCurveTo(10, -97, 15, -100); ctx.stroke();
  // front arm with a flaming fist
  seg(13, -84, 26, -66, 9, rock);
  shape('#ff8a1f', () => ctx.arc(29, -64, 7, 0, Math.PI * 2));
  shape(glow, () => { ctx.moveTo(24, -68); ctx.lineTo(28, -82 + flick(9)); ctx.lineTo(31, -72); ctx.lineTo(36, -80 + flick(10)); ctx.lineTo(35, -66); });
}

function drawXLR8(s, t) {
  const blue = '#1f4fc4', black = '#141824';
  if (keys.left || keys.right) { // speed streaks
    ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-70, -95 + i * 18); ctx.lineTo(-110 - (i % 2) * 20, -95 + i * 18); ctx.stroke(); }
  }
  // long striped tail
  const tail = [[-8, -58], [-24, -56], [-40, -50], [-56, -42], [-70, -36]];
  for (let i = 0; i < tail.length - 1; i++) {
    seg(tail[i][0], tail[i][1], tail[i + 1][0], tail[i + 1][1], 12 - i * 2.5, i % 2 ? blue : black);
  }
  // legs bend like a raptor's, with a ball on each foot
  [[-4, -s, black], [5, s, blue]].forEach(([hx, sw, c]) => {
    seg(hx, -50, hx - 8, -28, 10, c);
    seg(hx - 8, -28, hx + 2 + sw, -9, 7, black);
    shape('#2b2b2b', () => ctx.arc(hx + 2 + sw, -6, 6, 0, Math.PI * 2));
  });
  // body leaning forward
  shape(black, () => ctx.ellipse(4, -72, 15, 24, 0.35, 0, Math.PI * 2));
  shape(blue, () => ctx.ellipse(9, -74, 7, 17, 0.35, 0, Math.PI * 2));
  hourglass(6, -76, 6, omni());
  // arms with claws
  seg(4, -88, 18, -76, 6, black);
  seg(18, -76, 30, -80, 5, blue);
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let i = 0; i < 3; i++) { ctx.moveTo(31, -80); ctx.lineTo(37, -84 + i * 3); } ctx.stroke();
  // long head with the black visor
  shape(blue, () => ctx.ellipse(20, -104, 17, 10, 0.15, 0, Math.PI * 2));
  shape(black, () => { ctx.moveTo(6, -112); ctx.quadraticCurveTo(24, -120, 37, -104); ctx.lineTo(30, -102); ctx.quadraticCurveTo(20, -110, 6, -104); });
  ctx.strokeStyle = '#6a8cff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(12, -112); ctx.quadraticCurveTo(22, -116, 30, -109); ctx.stroke();
  ctx.strokeStyle = black; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(22, -97); ctx.lineTo(34, -99); ctx.stroke();
}

function drawFourArms(s, t) {
  const red = '#c8312a', redDark = '#9c231e';
  const arm = (sx, sy, ex, ey, hx, hy, c) => {
    seg(sx, sy, ex, ey, 11, c); seg(ex, ey, hx, hy, 10, c);
    shape(c, () => ctx.arc(hx, hy + 3, 7, 0, Math.PI * 2));
  };
  // back arms
  arm(-18, -90, -26, -72, -24 - s / 3, -56, redDark);
  arm(-16, -74, -24, -58, -20 - s / 3, -44, redDark);
  // legs in black pants, bare red feet
  seg(-7, -46, -7 - s, -8, 15, '#1c1c1c');
  seg(7, -46, 7 + s, -8, 15, '#262626');
  shape(red, () => ctx.ellipse(-5 - s, -3, 9, 4, 0, 0, Math.PI * 2));
  shape(red, () => ctx.ellipse(9 + s, -3, 9, 4, 0, 0, Math.PI * 2));
  // huge chest with muscles
  shape(red, () => {
    ctx.moveTo(-24, -96); ctx.quadraticCurveTo(2, -104, 26, -96);
    ctx.lineTo(18, -50); ctx.lineTo(-14, -50);
  });
  ctx.strokeStyle = redDark; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(1, -94); ctx.lineTo(1, -54);
  ctx.moveTo(-14, -80); ctx.quadraticCurveTo(-6, -76, 1, -80);
  ctx.moveTo(16, -80); ctx.quadraticCurveTo(8, -76, 1, -80);
  ctx.moveTo(-8, -66); ctx.lineTo(10, -66); ctx.moveTo(-6, -58); ctx.lineTo(10, -58);
  ctx.stroke();
  // white belt with the watch symbol
  shape('#f2f2f2', () => ctx.rect(-15, -54, 34, 8));
  hourglass(2, -50, 6, omni());
  // small head on big shoulders, with four yellow eyes
  shape(red, () => ctx.ellipse(4, -108, 12, 12, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#ffd400';
  [[4, -113], [12, -113], [4, -106], [12, -106]].forEach(([ex, ey]) => {
    ctx.beginPath(); ctx.ellipse(ex, ey, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.strokeStyle = '#5a1210'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(4, -100); ctx.lineTo(13, -100); ctx.stroke();
  shape('#1c1c1c', () => { ctx.moveTo(-6, -116); ctx.quadraticCurveTo(-4, -124, 6, -121); ctx.lineTo(-2, -114); });
  // front arms
  arm(20, -74, 30, -60, 34 + s / 3, -48, red);
  arm(22, -90, 32, -76, 38 + s / 3, -66, red);
}

function drawDiamondhead(s, t) {
  const gem = '#3fd18a', gemDark = '#1f9a62', gemLight = '#b6ffd9';
  const crystal = (pts, c) => shape(c, () => { ctx.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); });
  // back arm: crystal
  seg(-12, -84, -16 - s / 3, -58, 9, gemDark);
  crystal([[-20 - s / 3, -58], [-12 - s / 3, -58], [-16 - s / 3, -44]], gemDark);
  // legs in a black suit, crystal feet
  seg(-5, -46, -6 - s, -8, 12, '#1c1c1c');
  seg(5, -46, 6 + s, -8, 12, '#262626');
  crystal([[-12 - s, -1], [-6 - s, -10], [4 - s, -1]], gemDark);
  crystal([[0 + s, -1], [6 + s, -10], [16 + s, -1]], gem);
  // black and white suit
  shape('#1c1c1c', () => { ctx.moveTo(-16, -88); ctx.lineTo(16, -88); ctx.lineTo(16, -46); ctx.lineTo(-16, -46); });
  ctx.fillStyle = '#f2f2f2'; ctx.beginPath();
  ctx.moveTo(-4, -88); ctx.lineTo(6, -88); ctx.lineTo(-2, -46); ctx.lineTo(-10, -46); ctx.fill();
  hourglass(6, -70, 6, omni());
  // crystal shards on the shoulders
  crystal([[-18, -86], [-26, -104], [-10, -88]], gem);
  crystal([[12, -88], [24, -102], [18, -84]], gemDark);
  // diamond head with a tall back spike
  crystal([[-8, -94], [-16, -112], [-14, -140], [-2, -122], [8, -128], [20, -114], [18, -98], [6, -92]], gem);
  ctx.strokeStyle = gemLight; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-12, -134); ctx.lineTo(-6, -112); ctx.lineTo(8, -126); ctx.moveTo(-6, -112); ctx.lineTo(-2, -96); ctx.stroke();
  ctx.fillStyle = '#0e5c3a';
  ctx.beginPath(); ctx.moveTo(4, -110); ctx.lineTo(10, -112); ctx.lineTo(9, -108); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13, -112); ctx.lineTo(18, -111); ctx.lineTo(17, -108); ctx.fill();
  ctx.strokeStyle = '#0e5c3a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(8, -101); ctx.lineTo(16, -102); ctx.stroke();
  // front arm ending in a crystal blade
  seg(13, -84, 24, -66, 9, gem);
  crystal([[20, -68], [28, -66], [38, -58]], gemLight);
}

function drawWildmutt(s, t) {
  const fur = '#f08a24', furDark = '#c2621a';
  // tail and quills along the back
  seg(-30, -44, -42, -52, 6, fur);
  for (let i = 0; i < 5; i++) shape(furDark, () => { ctx.moveTo(-24 + i * 10, -50); ctx.lineTo(-20 + i * 10, -64); ctx.lineTo(-16 + i * 10, -50); });
  // four legs, running on all fours
  [[-22, -s, furDark], [16, s, furDark], [-16, s, fur], [22, -s, fur]].forEach(([lx, sw, c]) => {
    seg(lx, -36, lx + sw, -6, 9, c);
    shape(c, () => ctx.ellipse(lx + sw + 3, -3, 6, 3.5, 0, 0, Math.PI * 2));
  });
  shape(fur, () => ctx.ellipse(0, -40, 32, 15, 0, 0, Math.PI * 2));
  ctx.strokeStyle = furDark; ctx.lineWidth = 2;
  ctx.beginPath(); for (let i = 0; i < 3; i++) { ctx.moveTo(-14 + i * 10, -54); ctx.lineTo(-18 + i * 10, -44); } ctx.stroke();
  hourglass(14, -38, 6, omni());
  // head with no eyes, gills and a big toothy mouth
  shape(fur, () => ctx.ellipse(36, -48, 15, 11, 0.2, 0, Math.PI * 2));
  shape('#3a0d0d', () => { ctx.moveTo(36, -46); ctx.lineTo(52, -50); ctx.lineTo(50, -38); });
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(40 + i * 4, -47.5 - i); ctx.lineTo(42 + i * 4, -44 - i); ctx.lineTo(44 + i * 4, -48.5 - i); ctx.fill(); }
  ctx.strokeStyle = furDark; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let i = 0; i < 3; i++) { ctx.moveTo(26 + i * 3, -56); ctx.lineTo(24 + i * 3, -46); } ctx.stroke();
}

function drawGreyMatter(s, t) {
  const grey = '#9aa3ab', greyDark = '#737c84';
  seg(-6, -40, -8 - s, -8, 7, greyDark);
  seg(6, -40, 8 + s, -8, 7, grey);
  shape(greyDark, () => ctx.ellipse(-6 - s, -4, 7, 4, 0, 0, Math.PI * 2));
  shape(grey, () => ctx.ellipse(10 + s, -4, 7, 4, 0, 0, Math.PI * 2));
  // small body in a black and white suit
  shape('#1c1c1c', () => ctx.ellipse(0, -50, 13, 16, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#f2f2f2'; ctx.fillRect(-2, -64, 5, 28);
  hourglass(0, -46, 6, omni());
  seg(10, -58, 20, -46, 5, grey);
  // big head with huge eyes and a wide frog mouth
  shape(grey, () => ctx.ellipse(3, -84, 22, 19, 0, 0, Math.PI * 2));
  [[0, -88], [16, -88]].forEach(([ex, ey]) => {
    shape('#c8f05a', () => ctx.ellipse(ex, ey, 7, 8, 0, 0, Math.PI * 2));
    ctx.fillStyle = '#0d0d0d'; ctx.beginPath(); ctx.ellipse(ex + 2, ey, 2.5, 4, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.strokeStyle = '#3a3f44'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, -74); ctx.quadraticCurveTo(8, -68, 22, -76); ctx.stroke();
}

function drawStinkfly(s, t) {
  ctx.translate(0, -24 + Math.sin(t / 2) * 3); // hovering
  const green = '#9ccf3a', dark = '#4f7a1a';
  // buzzing wings
  const flap = Math.sin(t * 4) * 0.35;
  ctx.globalAlpha = 0.55;
  [[-6, -0.9], [-2, -0.5]].forEach(([wx, base]) => {
    ctx.save(); ctx.translate(wx, -70); ctx.rotate(base + flap);
    shape('#e8ffd0', () => ctx.ellipse(-26, 0, 28, 8, 0, 0, Math.PI * 2));
    ctx.restore();
  });
  ctx.globalAlpha = 1;
  // striped tail with a stinger
  shape(green, () => ctx.ellipse(-24, -58, 20, 10, 0.3, 0, Math.PI * 2));
  ctx.strokeStyle = dark; ctx.lineWidth = 2.5;
  ctx.beginPath(); for (let i = 0; i < 3; i++) { ctx.moveTo(-34 + i * 8, -66 + i * 2); ctx.lineTo(-30 + i * 8, -50 + i * 2); } ctx.stroke();
  shape('#2b2b2b', () => { ctx.moveTo(-42, -52); ctx.lineTo(-54, -44); ctx.lineTo(-40, -46); });
  // dangling legs
  for (let i = 0; i < 3; i++) seg(-4 + i * 7, -58, -6 + i * 7 + Math.sin(t + i) * 2, -36, 3, dark);
  // body and head
  shape(green, () => ctx.ellipse(2, -68, 13, 12, 0, 0, Math.PI * 2));
  hourglass(4, -66, 6, omni());
  shape(green, () => ctx.ellipse(18, -82, 11, 9, 0, 0, Math.PI * 2));
  // four eyes on stalks
  [[16, -100], [24, -102], [30, -96], [10, -97]].forEach(([ex, ey], i) => {
    seg(18 + i, -88, ex, ey, 2.5, dark);
    shape('#ffe14d', () => ctx.arc(ex, ey, 3.5, 0, Math.PI * 2));
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(ex + 1, ey, 1.4, 0, Math.PI * 2); ctx.fill();
  });
  ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(22, -78); ctx.lineTo(28, -78); ctx.stroke();
}

function drawRipjaws(s, t) {
  const skin = '#6f8f98', dark = '#4b6870', belly = '#d8e2dc';
  seg(-11, -82, -14 - s / 3, -54, 8, dark);
  seg(-5, -46, -6 - s, -8, 12, dark);
  seg(5, -46, 6 + s, -8, 12, skin);
  shape(dark, () => ctx.ellipse(-4 - s, -3, 9, 4, 0, 0, Math.PI * 2));
  shape(skin, () => ctx.ellipse(8 + s, -3, 9, 4, 0, 0, Math.PI * 2));
  // black and white suit
  shape('#1c1c1c', () => { ctx.moveTo(-16, -88); ctx.lineTo(16, -88); ctx.lineTo(15, -46); ctx.lineTo(-15, -46); });
  shape('#f2f2f2', () => ctx.rect(-15, -52, 30, 6));
  hourglass(0, -49, 5, omni());
  // fin on the back
  shape(dark, () => { ctx.moveTo(-14, -90); ctx.lineTo(-26, -108); ctx.lineTo(-8, -98); });
  // big head with a huge underbite full of teeth
  shape(skin, () => ctx.ellipse(4, -110, 18, 15, 0, 0, Math.PI * 2));
  shape(belly, () => { ctx.moveTo(-8, -102); ctx.quadraticCurveTo(14, -86, 30, -104); ctx.lineTo(26, -106); ctx.quadraticCurveTo(12, -96, -4, -104); });
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i * 5, -103 + i * 0.3); ctx.lineTo(2.5 + i * 5, -109); ctx.lineTo(5 + i * 5, -102.5 + i * 0.3); ctx.fill(); }
  ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.ellipse(12, -116, 3, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(13, -116, 1.2, 0, Math.PI * 2); ctx.fill();
  // glowing lure on his head
  ctx.strokeStyle = dark; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(4, -124); ctx.quadraticCurveTo(10, -138, 22, -132); ctx.stroke();
  shape('#ffe14d', () => ctx.arc(23, -130, 3.5, 0, Math.PI * 2));
  seg(13, -82, 24, -62, 8, skin);
  hand(27, -60, 0.4, skin);
}

function drawUpgrade(s, t) {
  const black = '#141414', glow = '#39ff6a';
  const lines = (pts) => { ctx.strokeStyle = glow; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); pts.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.stroke(); };
  seg(-11, -82, -14 - s / 3, -54, 8, black);
  seg(-5, -46, -6 - s, -6, 11, black);
  seg(5, -46, 6 + s, -6, 11, black);
  lines([[6 + s / 2, -40], [6 + s, -10]]);
  // smooth body with glowing circuit lines
  shape(black, () => ctx.ellipse(0, -66, 16, 24, 0, 0, Math.PI * 2));
  lines([[-10, -84], [-10, -70], [-4, -64], [-4, -48]]);
  lines([[10, -84], [10, -72], [4, -66]]);
  lines([[-14, -60], [-8, -56], [12, -56]]);
  hourglass(2, -72, 6, omni());
  // round head with one big eye
  shape(black, () => ctx.ellipse(4, -104, 15, 16, 0, 0, Math.PI * 2));
  shape(glow, () => ctx.arc(8, -106, 8, 0, Math.PI * 2));
  ctx.fillStyle = black; ctx.beginPath(); ctx.arc(8, -106, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(9, -106, 2.2, 0, Math.PI * 2); ctx.fill();
  lines([[-8, -114], [-4, -120], [6, -120]]);
  seg(12, -82, 24, -62, 8, black);
  hand(27, -60, 0.4, '#2a2a2a');
}

function drawGhostfreak(s, t) {
  ctx.translate(0, -16 + Math.sin(t / 3) * 4); // floating
  const pale = '#dfe4ea', stripe = '#2a2433';
  ctx.globalAlpha = 0.88;
  // ghostly tail instead of legs
  shape(pale, () => {
    ctx.moveTo(-15, -60); ctx.lineTo(15, -60);
    ctx.quadraticCurveTo(10, -30, -2 + Math.sin(t) * 4, -6);
    ctx.quadraticCurveTo(-10, -30, -15, -60);
  });
  seg(-12, -84, -20, -60 + Math.sin(t) * 3, 7, pale);
  shape(pale, () => ctx.ellipse(0, -74, 16, 20, 0, 0, Math.PI * 2));
  ctx.strokeStyle = stripe; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(-12, -86); ctx.quadraticCurveTo(-4, -76, -10, -60);
  ctx.moveTo(12, -84); ctx.quadraticCurveTo(4, -72, 10, -58);
  ctx.moveTo(-6, -44); ctx.quadraticCurveTo(0, -30, -4, -18);
  ctx.stroke();
  hourglass(0, -76, 6, omni());
  // head with one big eye
  shape(pale, () => ctx.ellipse(4, -106, 15, 17, 0, 0, Math.PI * 2));
  ctx.strokeStyle = stripe; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8, -118); ctx.quadraticCurveTo(0, -110, -6, -98); ctx.stroke();
  shape('#ffffff', () => ctx.ellipse(10, -108, 7, 6, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#7a1c8a'; ctx.beginPath(); ctx.arc(11, -108, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(11.5, -108, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = stripe; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(6, -97); ctx.lineTo(16, -98); ctx.stroke();
  seg(12, -84, 26, -70, 7, pale);
  for (let i = 0; i < 3; i++) seg(26, -70, 33, -74 + i * 4, 2, pale);
  ctx.globalAlpha = 1;
}

function draw() {
  // sky and ground
  ctx.fillStyle = '#1d3b52'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#c99a5b'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#7d5a2f'; ctx.fillRect(0, GROUND, W, 6);
  // some desert rocks
  ctx.fillStyle = '#8b5e34';
  [[150, 40], [480, 60], [700, 30]].forEach(([rx, rh]) => ctx.fillRect(rx, GROUND - rh, 50, rh));

  if (hero.alien) drawAlien(hero.x, hero.y, hero.alien);
  else drawBenjji(hero.x, hero.y);

  if (flash) {
    ctx.fillStyle = `rgba(57,255,106,${flash / 25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
