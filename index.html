<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Benjji 10</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a10; color: #eaffea;
    font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #game { display: block; margin: 0 auto; background: #1d3b52; max-width: 100%; }
  #hud { position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-weight: 700; text-shadow: 0 2px 0 #000; pointer-events: none; }
  .pad { position: absolute; bottom: 16px; display: flex; gap: 10px; align-items: center; }
  .pad button { width: 58px; height: 58px; border-radius: 50%; border: 3px solid #39ff6a;
    background: #102a17cc; color: #eaffea; font-size: 24px; font-weight: 700; }
  #left { left: 16px; }
  #right { right: 16px; }
  #powerBtn { background: #ff8a1f; color: #000; font-size: 12px; border-color: #ffd23a; }
  #watchBtn { width: 80px; height: 80px; background: #39ff6a; color: #000; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div id="hud">Benjji · Y to pick an alien, W to go hero</div>
<div class="pad" id="left">
  <button data-key="left">◀</button>
  <button data-key="right">▶</button>
</div>
<div class="pad" id="right">
  <button data-key="up">▲</button>
  <button data-key="dial">Y</button>
  <button data-key="swap" style="font-size:12px">SWAP</button>
  <button id="powerBtn" data-key="power">POWER</button>
  <button id="watchBtn" data-key="watch">WATCH</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = canvas.width, H = canvas.height, GROUND = H - 70;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// The watch's aliens: the first ten from the show, plus Cannonbolt, Wildvine and Upchuck,
// who were unlocked later. Each one moves differently and has its own powers:
// P uses the power, O swaps to the next one.
const ALIENS = [
  { name: 'Heatblast',   draw: drawHeatblast,   speed: 5,   jump: 13, size: 1.0,
    powers: [['Fireballs', fireballs], ['Flamethrower', flamethrower], ['Fire rocket jump', fireJump]] },
  { name: 'Wildmutt',    draw: drawWildmutt,    speed: 8,   jump: 14, size: 1.0,
    powers: [['Super pounce', pounce], ['Claw slash', clawSlash], ['Mega roar', roar]] },
  { name: 'Diamondhead', draw: drawDiamondhead, speed: 4.5, jump: 11, size: 1.05,
    powers: [['Crystal shards', crystals], ['Crystal spikes', crystalSpikes], ['Crystal blade', crystalBlade]] },
  { name: 'XLR8',        draw: drawXLR8,        speed: 12,  jump: 12, size: 0.95,
    powers: [['Speed dash', speedDash], ['Speed tornado', tornado], ['Tail whip', tailWhip]] },
  { name: 'Grey Matter', draw: drawGreyMatter,  speed: 3,   jump: 9,  size: 0.45,
    powers: [['Super brain', superBrain], ['Frog leap', frogLeap]] },
  { name: 'Four Arms',   draw: drawFourArms,    speed: 3.5, jump: 10, size: 1.3,
    powers: [['Ground smash', groundSmash], ['Thunder clap', thunderClap], ['Super jump slam', jumpSlam]] },
  { name: 'Stinkfly',    draw: drawStinkfly,    speed: 6,   jump: 10, size: 0.95, fly: true,
    powers: [['Slime spit', slime], ['Stink cloud', stinkCloud], ['Stinger', stinger]] },
  { name: 'Ripjaws',     draw: drawRipjaws,     speed: 4,   jump: 11, size: 1.05,
    powers: [['Mega chomp', chomp], ['Shark dive', sharkDive], ['Lure flash', lureFlash]] },
  { name: 'Upgrade',     draw: drawUpgrade,     speed: 5,   jump: 12, size: 1.0,
    powers: [['Merge & control', merge], ['Laser beam', laser], ['Tech merge cannon', megaBlast], ['Goo stretch punch', stretchPunch]] },
  { name: 'Ghostfreak',  draw: drawGhostfreak,  speed: 5,   jump: 10, size: 1.05, fly: true,
    powers: [['Go invisible', vanish], ['Ghost tentacles', tentacles], ['Scare', scare]] },
  { name: 'Cannonbolt',  draw: drawCannonbolt,  speed: 4,   jump: 11, size: 1.1,
    powers: [['Cannonball roll', roll], ['Mega bounce', megaBounce]] },
  { name: 'Wildvine',    draw: drawWildvine,    speed: 5,   jump: 13, size: 1.05,
    powers: [['Seed bombs', seedBombs], ['Vine whip', vineWhip], ['Vine swing', vineSwing]] },
  { name: 'Upchuck',     draw: drawUpchuck,     speed: 4,   jump: 10, size: 0.8,
    powers: [['Tongue grab: eat it!', eat], ['Spit explosive goo', spitGoo]] },
];
// Like the show: an alien lasts 10 minutes, then the watch turns red and has to recharge.
const HERO_MS = 10 * 60 * 1000;
const RECHARGE_MS = 5 * 1000;

const hero = { x: 120, y: GROUND, vy: 0, face: 1, alien: null, until: 0, recharge: 0, dial: 0, walk: 0,
  cool: 0, dash: 0, dashV: 0, rolling: 0, ghost: 0, pw: 0, ammo: 0, slam: 0, chompOnLand: 0, merged: null };
const keys = {};

// W / WATCH: press once to go hero, press again to change back.
function useWatch() {
  if (hero.alien) return changeBack(false);
  if (Date.now() < hero.recharge) return;
  hero.alien = ALIENS[hero.dial];
  hero.pw = 0;
  hero.until = Date.now() + HERO_MS;
  flash = 20;
}

// Y: turn the dial to pick an alien, or change back if already an alien.
function dial() {
  if (hero.alien) return changeBack(false);
  hero.dial = (hero.dial + 1) % ALIENS.length;
}

function changeBack(timedOut) {
  unmerge();
  hero.alien = null;
  hero.dash = hero.rolling = hero.ghost = hero.slam = hero.chompOnLand = hero.ammo = 0;
  if (timedOut) hero.recharge = Date.now() + RECHARGE_MS;
  flash = 20;
}

// The watch glows green, blinks red in the last 10 seconds, and stays red while recharging.
function omni() {
  const now = Date.now();
  if (now < hero.recharge) return '#ff3030';
  if (hero.alien && hero.until - now < 10000) return Math.floor(now / 250) % 2 ? '#ff3030' : '#39ff6a';
  return '#39ff6a';
}

const ACTIONS = { watch: useWatch, dial, power: usePower, swap: swapPower };
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ' ': 'up', w: 'watch', W: 'watch', y: 'dial', Y: 'dial', p: 'power', P: 'power', o: 'swap', O: 'swap' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (ACTIONS[k]) { if (!e.repeat) ACTIONS[k](); } else keys[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (k) keys[k] = false;
});
document.querySelectorAll('[data-key]').forEach(b => {
  const k = b.dataset.key;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (ACTIONS[k]) ACTIONS[k](); else keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => keys[k] = false));
});

let flash = 0;

function clock(ms) {
  const sec = Math.ceil(ms / 1000);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function update() {
  const a = hero.alien;
  const m = hero.merged && MERGE[kindOf(hero.merged)];
  const speed = m ? m.speed : a ? a.speed : 4, jump = m ? m.jump : a ? a.jump : 11;
  let moving = false;
  if (keys.left)  { hero.x -= speed; hero.face = -1; moving = true; }
  if (keys.right) { hero.x += speed; hero.face = 1;  moving = true; }
  hero.x = Math.max(50, Math.min(W - 50, hero.x));
  if (keys.up && a && a.fly && !m) hero.vy = Math.max(hero.vy - 1.2, -6); // flyers keep going up
  else if (keys.up && hero.y >= GROUND) hero.vy = -jump;
  hero.vy += 0.6;
  hero.y = Math.max(170, Math.min(GROUND, hero.y + hero.vy));
  if (hero.y >= GROUND) hero.vy = 0;
  hero.walk = moving ? hero.walk + 0.25 : 0;

  const now = Date.now();
  updatePowers(now);
  if (a && now >= hero.until) changeBack(true);
  if (flash) flash--;

  if (hero.merged) hud.textContent = `Upgrade is controlling the ${MERGE[kindOf(hero.merged)].name}! · P: shoot · O: jump out · ${clock(hero.until - now)} left`;
  else if (hero.alien) hud.textContent = `${a.name} · P: ${a.powers[hero.pw][0]} (${hero.pw + 1}/${a.powers.length}) · O swaps${a.name === 'Upchuck' ? ` · goo: ${hero.ammo}` : ''} · ${clock(hero.until - now)} left`;
  else if (now < hero.recharge) hud.textContent = `Watch recharging… ${Math.ceil((hero.recharge - now) / 1000)}s`;
  else hud.textContent = `Benjji · alien ${hero.dial + 1} of ${ALIENS.length}: ${ALIENS[hero.dial].name} · Y to pick, W to go hero, W again to change back`;
}

// The hourglass symbol: two green triangles meeting in the middle.
function hourglass(cx, cy, r, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, -r * 0.6); ctx.lineTo(r * 0.8, -r * 0.6); ctx.lineTo(0, 0);
  ctx.moveTo(-r * 0.8,  r * 0.6); ctx.lineTo(r * 0.8,  r * 0.6); ctx.lineTo(0, 0);
  ctx.fill();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = Math.max(1, r * 0.2);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

const SCALE = 1.9; // how big the characters are on screen
const SKIN = '#f3c9a0', LINE = '#2a1a10';

// A thick rounded limb with a dark outline.
function seg(x1, y1, x2, y2, w, color) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = LINE; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function shape(fill, build) {
  ctx.beginPath(); build(); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.stroke();
}

// A cartoon hand: palm, four finger bumps and a thumb.
function hand(x, y, angle, skin) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  shape(skin, () => ctx.ellipse(0, 0, 5.5, 5, 0, 0, Math.PI * 2));
  for (let i = 0; i < 4; i++) shape(skin, () => ctx.ellipse(5, -3.6 + i * 2.4, 2.6, 1.5, 0, 0, Math.PI * 2));
  shape(skin, () => ctx.ellipse(1, -5.5, 1.8, 3, -0.5, 0, Math.PI * 2));
  ctx.restore();
}

function sneaker(x, y) {
  shape('#1c1c1c', () => { ctx.moveTo(x - 7, y - 1); ctx.quadraticCurveTo(x - 6, y - 9, x + 2, y - 8); ctx.quadraticCurveTo(x + 11, y - 6, x + 11, y - 1); });
  shape('#f2f2f2', () => ctx.rect(x - 8, y - 2, 20, 3));
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 2, y - 7); ctx.lineTo(x + 3, y - 4); ctx.stroke();
}

function drawBenjji(x, y) {
  const s = hero.y < GROUND ? 0 : Math.sin(hero.walk) * 9;
  const air = hero.y < GROUND;
  const breathe = Math.sin(Date.now() / 450) * 0.6;
  const SHADE = '#e0b089', HAIR = '#5a3216', HAIR_LIGHT = '#8a5530';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * SCALE, SCALE);

  // back arm (darker because it's behind him)
  seg(-12, -78, -15 - s / 3, -63, 8.5, '#e2e2dd');
  seg(-15 - s / 3, -63, -14 - s / 2, -51, 6.5, SHADE);
  hand(-14 - s / 2, -48, Math.PI / 2, SHADE);

  // legs: green cargo pants
  const backFoot = air ? -7 : -6 - s, frontFoot = air ? 8 : 6 + s;
  seg(-5, -46, backFoot, -9, 12.5, '#4a5a2d');
  sneaker(backFoot, 0);
  seg(5, -46, frontFoot, -9, 12.5, '#5b6e37');
  shape('#4e602f', () => ctx.rect(frontFoot / 2 + 2.5, -34, 8, 8)); // cargo pocket
  ctx.strokeStyle = LINE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(frontFoot / 2 + 2.5, -31.5); ctx.lineTo(frontFoot / 2 + 10.5, -31.5); ctx.stroke();
  sneaker(frontFoot, 0);

  // white T-shirt with the black stripe down the middle
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-15, -82 + breathe); ctx.quadraticCurveTo(0, -87 + breathe, 15, -82 + breathe);
  ctx.lineTo(16, -48); ctx.quadraticCurveTo(0, -46, -16, -48); ctx.closePath();
  ctx.fillStyle = '#f8f8f5'; ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#e3e3de'; ctx.fillRect(-16, -86, 5, 40);           // shadow on the back side
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-3.5, -90, 7.5, 44);        // the stripe
  ctx.restore();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-15, -82 + breathe); ctx.quadraticCurveTo(0, -87 + breathe, 15, -82 + breathe);
  ctx.lineTo(16, -48); ctx.quadraticCurveTo(0, -46, -16, -48); ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = '#cfcfc8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8, -70); ctx.quadraticCurveTo(11, -64, 9, -58); ctx.stroke(); // shirt fold

  // neck
  seg(1, -86, 1, -92, 8, SHADE);

  // hair at the back of his head
  shape(HAIR, () => ctx.ellipse(1, -114, 21, 19, 0, 0, Math.PI * 2));

  // round face: big head, small chin, so he looks younger
  shape(SKIN, () => {
    ctx.moveTo(-12, -116); ctx.quadraticCurveTo(-14, -96, 2, -91);
    ctx.quadraticCurveTo(18, -90, 22, -104); ctx.quadraticCurveTo(24, -116, 18, -122);
    ctx.lineTo(-8, -124);
  });
  shape(SKIN, () => ctx.ellipse(-10, -108, 4, 5.5, 0, 0, Math.PI * 2)); // ear
  ctx.strokeStyle = SHADE; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(-10, -108, 2, -1, 1.5); ctx.stroke();

  // big green eyes with a thick top line
  [[7, 4.6, 5.6], [17.5, 3.8, 5]].forEach(([ex, rx, ry]) => {
    shape('#fff', () => ctx.ellipse(ex, -108, rx, ry, 0, 0, Math.PI * 2));
    ctx.fillStyle = '#2f9e44'; ctx.beginPath(); ctx.arc(ex + 1.2, -107.5, rx * 0.72, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7fd36a'; ctx.beginPath(); ctx.arc(ex + 1.2, -106.5, rx * 0.4, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#0d0d0d'; ctx.beginPath(); ctx.arc(ex + 1.4, -107.5, rx * 0.33, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 2.4, -109.5, 1.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(ex, -108, rx, ry, 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  });
  // thick, sure-of-himself eyebrows
  ctx.strokeStyle = '#3d220e'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2, -115.5); ctx.quadraticCurveTo(7, -118, 11, -116.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(14.5, -116.5); ctx.quadraticCurveTo(18, -118, 21, -116); ctx.stroke();
  // small nose and a cheeky half smile
  ctx.strokeStyle = '#b07a55'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(21.5, -104); ctx.quadraticCurveTo(23.5, -101, 20.5, -100); ctx.stroke();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(10, -96.5); ctx.quadraticCurveTo(15, -94, 19.5, -98.5); ctx.stroke();
  ctx.fillStyle = 'rgba(230,120,110,0.25)';
  ctx.beginPath(); ctx.ellipse(5, -100, 3.5, 2, 0, 0, Math.PI * 2); ctx.fill(); // rosy cheek

  // his famous hair: thick on top, bangs swooping forward over the forehead
  shape(HAIR, () => {
    ctx.moveTo(-19, -104); ctx.quadraticCurveTo(-24, -126, -6, -134);
    ctx.quadraticCurveTo(12, -139, 22, -130); ctx.quadraticCurveTo(28, -124, 27, -114);
    ctx.lineTo(22, -119); ctx.lineTo(20, -112); ctx.lineTo(15, -119);
    ctx.lineTo(11, -113); ctx.lineTo(7, -120); ctx.lineTo(2, -116);
    ctx.lineTo(-2, -121); ctx.quadraticCurveTo(-8, -114, -8, -104);
    ctx.quadraticCurveTo(-13, -100, -19, -104);
  });
  ctx.strokeStyle = HAIR_LIGHT; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-14, -126); ctx.quadraticCurveTo(0, -134, 14, -130);
  ctx.moveTo(-4, -126); ctx.quadraticCurveTo(10, -129, 20, -122);
  ctx.stroke();

  // front arm, bent forward to show off the watch on his wrist
  seg(11, -78, 15, -64, 8.5, '#f8f8f5');
  seg(15, -64, 29, -59, 6.5, SKIN);
  hand(33, -58, -0.3, SKIN);
  // the watch: chunky black and white band, round grey dial, green hourglass
  shape('#1e1e1e', () => ctx.rect(21.5, -64.5, 9, 11));
  shape('#e8e8e8', () => ctx.rect(21.5, -63, 9, 2.5));
  shape('#9aa0a6', () => ctx.arc(26, -59, 7.5, 0, Math.PI * 2));
  hourglass(26, -59, 5.5, omni());

  ctx.restore();
}

// Each alien is drawn facing right with its feet at y = 0, like Benjji.
function drawAlien(x, y, a) {
  const t = Date.now() / 120;
  const s = hero.y < GROUND ? 0 : Math.sin(hero.walk) * 9;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * a.size * SCALE, a.size * SCALE);
  a.draw(s, t);
  ctx.restore();
}

function drawHeatblast(s, t) {
  const rock = '#8e2416', rockDark = '#6a180e', glow = '#ffcf3a';
  // back arm and legs
  seg(-12, -84, -16 - s / 3, -58, 9, rockDark);
  shape('#ff8a1f', () => ctx.arc(-16 - s / 3, -54, 6, 0, Math.PI * 2));
  seg(-5, -46, -6 - s, -6, 12, rockDark);
  seg(5, -46, 6 + s, -6, 12, rock);
  // rocky body with glowing magma cracks
  shape(rock, () => {
    ctx.moveTo(-17, -88); ctx.lineTo(-6, -92); ctx.lineTo(16, -90); ctx.lineTo(19, -62);
    ctx.lineTo(12, -44); ctx.lineTo(-12, -44); ctx.lineTo(-18, -63);
  });
  ctx.strokeStyle = glow; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -80); ctx.lineTo(-8, -72); ctx.lineTo(-12, -60); ctx.lineTo(-6, -50);
  ctx.moveTo(14, -82); ctx.lineTo(9, -74); ctx.lineTo(13, -62); ctx.lineTo(8, -48);
  ctx.moveTo(-4, -46); ctx.lineTo(0, -54); ctx.lineTo(5, -46);
  ctx.moveTo(-5, -30); ctx.lineTo(-7, -20); ctx.moveTo(6, -32); ctx.lineTo(8, -18);
  ctx.stroke();
  hourglass(0, -68, 7, omni());
  // head made of fire, flickering
  const flick = i => Math.sin(t * 1.3 + i * 1.7) * 4;
  shape('#ff6a1a', () => {
    ctx.moveTo(-14, -94); ctx.lineTo(-18, -114 + flick(1)); ctx.lineTo(-10, -110);
    ctx.lineTo(-8, -134 + flick(2)); ctx.lineTo(0, -120); ctx.lineTo(6, -142 + flick(3));
    ctx.lineTo(10, -122); ctx.lineTo(20, -134 + flick(4)); ctx.lineTo(18, -112);
    ctx.lineTo(24, -104 + flick(5)); ctx.lineTo(18, -94);
  });
  shape('#ffb21f', () => {
    ctx.moveTo(-8, -96); ctx.lineTo(-8, -118 + flick(6)); ctx.lineTo(0, -110);
    ctx.lineTo(6, -128 + flick(7)); ctx.lineTo(10, -112); ctx.lineTo(16, -118 + flick(8)); ctx.lineTo(14, -96);
  });
  // face: bright eyes and a grin
  ctx.fillStyle = '#fffbe0';
  ctx.beginPath(); ctx.ellipse(5, -107, 3.5, 2, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -107, 3, 1.8, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a1c06'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(5, -100); ctx.quadraticCurveTo(10, -97, 15, -100); ctx.stroke();
  // front arm with a flaming fist
  seg(13, -84, 26, -66, 9, rock);
  shape('#ff8a1f', () => ctx.arc(29, -64, 7, 0, Math.PI * 2));
  shape(glow, () => { ctx.moveTo(24, -68); ctx.lineTo(28, -82 + flick(9)); ctx.lineTo(31, -72); ctx.lineTo(36, -80 + flick(10)); ctx.lineTo(35, -66); });
}

function drawXLR8(s, t) {
  const blue = '#1f4fc4', black = '#141824';
  if (keys.left || keys.right) { // speed streaks
    ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-70, -95 + i * 18); ctx.lineTo(-110 - (i % 2) * 20, -95 + i * 18); ctx.stroke(); }
  }
  // long striped tail
  const tail = [[-8, -58], [-24, -56], [-40, -50], [-56, -42], [-70, -36]];
  for (let i = 0; i < tail.length - 1; i++) {
    seg(tail[i][0], tail[i][1], tail[i + 1][0], tail[i + 1][1], 12 - i * 2.5, i % 2 ? blue : black);
  }
  // legs bend like a raptor's, with a ball on each foot
  [[-4, -s, black], [5, s, blue]].forEach(([hx, sw, c]) => {
    seg(hx, -50, hx - 8, -28, 10, c);
    seg(hx - 8, -28, hx + 2 + sw, -9, 7, black);
    shape('#2b2b2b', () => ctx.arc(hx + 2 + sw, -6, 6, 0, Math.PI * 2));
  });
  // body leaning forward

// ---- Powers ----
const shots = [], effects = [], bits = [];
const rocks = [[150, 70], [480, 90], [700, 60]].map(([x, h]) => ({ x, h, w: 50, back: 0 }))
  .concat([[320, 55], [610, 50]].map(([x, h]) => ({ x, h, w: 36, back: 0, metal: true })))
  .concat([{ x: 245, h: 40, w: 40, back: 0, box: true }]);
let shake = 0;

// O / SWAP: switch to the alien's next power.
function swapPower() {
  if (hero.merged) return unmerge();
  if (hero.alien) hero.pw = (hero.pw + 1) % hero.alien.powers.length;
}

// P / POWER: use the current alien's power.
function usePower() {
  const a = hero.alien, now = Date.now();
  if (!a || now < hero.cool) return;
  hero.cool = now + 400;
  if (hero.merged) return mergedShot(now);
  const k = a.size * SCALE, f = hero.face;
  a.powers[hero.pw][1](hero.x + f * 30 * k, hero.y - 45 * k, f, k, now);
}

function fireballs(x, y, f) { shots.push({ kind: 'fire', x, y, vx: f * 10, vy: 1, r: 9, life: 90 }); }
function crystals(x, y, f) { for (let i = -1; i <= 1; i++) shots.push({ kind: 'crystal', x, y, vx: f * 11, vy: 1 + i * 1.5, r: 6, life: 70 }); }
function slime(x, y, f) { shots.push({ kind: 'slime', x, y: y - 30, vx: f * 8, vy: -2, r: 8, life: 120, fall: 0.25 }); }
function laser(x, y, f) { shots.push({ kind: 'laser', x, y, vx: f * 20, vy: 1.5, r: 4, life: 45, pierce: true }); }
function seedBombs(x, y, f) { shots.push({ kind: 'seed', x, y, vx: f * 6, vy: -8, r: 6, life: 200, fall: 0.4, boom: true }); }
function pounce(x, y, f, k, now) { hero.vy = -14; hero.dash = now + 600; hero.dashV = f * 11; }
function speedDash(x, y, f, k, now) { hero.dash = now + 450; hero.dashV = f * 26; }
function roll(x, y, f, k, now) { hero.rolling = now + 3000; }
function vanish(x, y, f, k, now) { hero.ghost = now + 5000; }
function groundSmash(x, y, f, k, now) { hero.vy = 0; shake = 15; blast(hero.x, GROUND, 170, 'quake'); }
function chomp(x, y, f, k) { blast(x + f * 20, y, 70, 'chomp', f); }
// Grey Matter works out the weak spot of the nearest rock, and it crumbles.
function superBrain(x, y, f, k, now) {
  effects.push({ kind: 'idea', born: now, life: 1500 });
  const target = rocks.filter(r => !r.back).sort((p, q) => Math.abs(p.x + p.w / 2 - hero.x) - Math.abs(q.x + q.w / 2 - hero.x))[0];
  if (target) setTimeout(() => smashRock(target), 700);
}

function smashRock(r) {
  if (r.back) return;
  r.back = Date.now() + 4000;
  for (let i = 0; i < 10; i++) bits.push({ x: r.x + r.w / 2, metal: r.metal, box: r.box, y: GROUND - r.h / 2, vx: (Math.random() - 0.5) * 10, vy: -Math.random() * 9, life: 60 });
}

function blast(x, y, radius, kind, f, color) {
  effects.push({ kind, x, y, r: radius, f, color, born: Date.now(), life: kind === 'gas' ? 1200 : 400 });
  rocks.forEach(r => { if (Math.abs(r.x + r.w / 2 - x) < radius + r.w / 2 && y > GROUND - r.h - radius) smashRock(r); });
}

function hitsRock(x, y, pad) {
  return rocks.find(r => !r.back && x > r.x - pad && x < r.x + r.w + pad && y > GROUND - r.h - pad);
}

function updatePowers(now) {
  const a = hero.alien;
  if (a && now < hero.dash) hero.x += hero.dashV;
  if (a && now < hero.rolling) {
    hero.x += hero.face * 10;
    if (hero.x <= 50 || hero.x >= W - 50) hero.face *= -1; // bounce off the edges
  }
  hero.x = Math.max(50, Math.min(W - 50, hero.x));
  // Four Arms' jump slam and Ripjaws' shark dive hit when they land
  if (hero.slam && now > hero.slam && hero.y >= GROUND) { hero.slam = 0; groundSmash(); }
  if (hero.chompOnLand && now > hero.chompOnLand && hero.y >= GROUND) {
    hero.chompOnLand = 0;
    blast(hero.x + hero.face * 50, GROUND - 40, 70, 'chomp', hero.face);
  }
  // smash rocks by running, pouncing or rolling into them
  if (a && (now < hero.dash || now < hero.rolling)) {
    const r = hitsRock(hero.x, hero.y - 10, 20);
    if (r) { smashRock(r); shake = 6; }
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const p = shots[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.fall || 0;
    let dead = --p.life <= 0 || p.x < -20 || p.x > W + 20;
    const r = hitsRock(p.x, p.y, p.r);
    if (r) { smashRock(r); if (!p.pierce) dead = true; }
    if (p.y >= GROUND) { p.y = GROUND; dead = true; }
    if (dead) { if (p.boom) blast(p.x, p.y, 70, 'boom'); shots.splice(i, 1); }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.x += b.vx; b.y += b.vy; b.vy += 0.5;
    if (--b.life <= 0) bits.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--) if (now - effects[i].born > effects[i].life) effects.splice(i, 1);
  rocks.forEach(r => { if (r.back && now > r.back) r.back = 0; });
  if (shake) shake--;
}

function drawPowers(now) {
  shots.forEach(p => {
    if (p.kind === 'fire') {
      ctx.fillStyle = '#ff6a1a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,30,0.4)'; ctx.beginPath(); ctx.arc(p.x - p.vx, p.y, p.r * 0.8, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'crystal') {
      const d = Math.sign(p.vx);
      shape(p.color || '#3fd18a', () => { ctx.moveTo(p.x + d * 10, p.y); ctx.lineTo(p.x - d * 6, p.y - 5); ctx.lineTo(p.x - d * 6, p.y + 5); });
    } else if (p.kind === 'slime') {
      shape('#9ccf3a', () => ctx.ellipse(p.x, p.y, p.r, p.r * 0.75, 0, 0, Math.PI * 2));
    } else if (p.kind === 'laser') {
      ctx.strokeStyle = '#39ff6a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y); ctx.stroke();
      ctx.strokeStyle = '#eaffea'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y); ctx.stroke();
    } else if (p.kind === 'wave') {
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 4;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(p.x - Math.sign(p.vx) * i * 12, p.y, p.r - i * 6, -0.8 + (p.vx < 0 ? Math.PI : 0), 0.8 + (p.vx < 0 ? Math.PI : 0)); ctx.stroke(); }
    } else if (p.kind === 'plasma') {
      shape('#39ff6a', () => ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2));
      ctx.fillStyle = '#eaffea'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'goo') {
      shape('#c6e84a', () => ctx.ellipse(p.x, p.y, p.r, p.r * 0.8, now / 150, 0, Math.PI * 2));
    } else if (p.kind === 'seed') {
      shape('#6b8e23', () => ctx.ellipse(p.x, p.y, 6, 8, now / 100, 0, Math.PI * 2));
    }
  });
  bits.forEach(b => { ctx.fillStyle = b.metal ? '#9aa3ab' : b.box ? '#b5833f' : '#8b5e34'; ctx.fillRect(b.x - 4, b.y - 4, 8, 8); });
  effects.forEach(e => {
    const t = (now - e.born) / e.life;
    ctx.save(); ctx.globalAlpha = 1 - t;
    if (e.kind === 'quake' || e.kind === 'boom') {
      ctx.strokeStyle = e.kind === 'quake' ? '#f2e6c9' : '#ff8a1f'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r * t + 10, (e.r * t + 10) * (e.kind === 'quake' ? 0.25 : 0.8), 0, 0, Math.PI * 2); ctx.stroke();
    } else if (e.kind === 'chomp') {
      ctx.fillStyle = '#fff';
      const open = 20 * (1 - t);
      for (let i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(e.x - 25 + i * 10, e.y - open); ctx.lineTo(e.x - 20 + i * 10, e.y - open + 12); ctx.lineTo(e.x - 15 + i * 10, e.y - open); ctx.fill();
        ctx.beginPath(); ctx.moveTo(e.x - 25 + i * 10, e.y + open); ctx.lineTo(e.x - 20 + i * 10, e.y + open - 12); ctx.lineTo(e.x - 15 + i * 10, e.y + open); ctx.fill();
      }
    } else if (e.kind === 'slash') {
      ctx.strokeStyle = e.color || '#ffffff'; ctx.lineWidth = 5;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(e.x - e.f * 10, e.y - 10 + i * 12, 30, -0.9, 0.9, false); ctx.stroke(); }
    } else if (e.kind === 'spikes') {
      const up = Math.min(1, t * 4);
      for (let i = -2; i <= 2; i++) shape('#3fd18a', () => { ctx.moveTo(e.x + i * 22 - 10, e.y); ctx.lineTo(e.x + i * 22, e.y - (70 - Math.abs(i) * 15) * up); ctx.lineTo(e.x + i * 22 + 10, e.y); });
    } else if (e.kind === 'tornado') {
      ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(hero.x, e.y - 20 - i * 30, 25 + i * 14, 8 + i * 2, 0, now / 80 + i, now / 80 + i + 4); ctx.stroke(); }
    } else if (e.kind === 'gas') {
      ctx.fillStyle = '#b4d84a';
      for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(e.x + Math.cos(i * 0.9) * e.r * t, e.y + Math.sin(i * 1.7) * 30, 18 + 20 * t, 0, Math.PI * 2); ctx.fill(); }
    } else if (e.kind === 'tentacles') {
      ctx.strokeStyle = '#2a2433'; ctx.lineWidth = 5;
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4, len = e.r * Math.sin(Math.PI * t);
        ctx.beginPath(); ctx.moveTo(hero.x, hero.y - 70);
        ctx.quadraticCurveTo(hero.x + Math.cos(ang + 0.5) * len * 0.6, hero.y - 70 + Math.sin(ang + 0.5) * len * 0.6, hero.x + Math.cos(ang) * len, hero.y - 70 + Math.sin(ang) * len);
        ctx.stroke();
      }
    } else if (e.kind === 'stretch' || e.kind === 'tongue') {
      const reach = Math.sin(Math.PI * t);
      const tx = e.kind === 'tongue' ? e.tx : e.x + e.f * 120, ty = e.kind === 'tongue' ? e.ty : e.y;
      ctx.strokeStyle = e.kind === 'tongue' ? '#d65a7a' : e.color; ctx.lineWidth = e.kind === 'tongue' ? 5 : 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + (tx - e.x) * reach, e.y + (ty - e.y) * reach); ctx.stroke();
    } else if (e.kind === 'vine') {
      ctx.strokeStyle = '#4f9a2e'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(hero.x, hero.y - 100); ctx.lineTo(e.x, 60); ctx.stroke();
    } else if (e.kind === 'lure') {
      ctx.fillStyle = 'rgba(255,240,140,0.6)';
      ctx.beginPath(); ctx.arc(hero.x + hero.face * 40, hero.y - 250, 40 + 200 * t, 0, Math.PI * 2); ctx.fill();
    } else if (e.kind === 'say') {
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(e.text, Math.max(200, Math.min(W - 200, hero.x)), hero.y - 250);
    } else if (e.kind === 'boo' || e.kind === 'hungry') {
      ctx.fillStyle = e.kind === 'boo' ? '#e8e0ff' : '#ffffff'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(e.kind === 'boo' ? 'BOO!' : 'Hungry! Eat first', hero.x, hero.y - 290 - t * 20);
    } else if (e.kind === 'idea') {
      const bx = hero.x + hero.face * 10, by = hero.y - 110;
      shape('#ffffff', () => ctx.ellipse(bx, by, 34, 20, 0, 0, Math.PI * 2));
      shape('#ffe14d', () => ctx.arc(bx - 14, by - 2, 7, 0, Math.PI * 2));
      ctx.fillStyle = '#222'; ctx.font = 'bold 12px system-ui'; ctx.fillText('E=mc²', bx - 4, by + 4);
    }
    ctx.restore();
  });
}

// Upchuck's long tongues grab the nearest rock or metal barrel and he eats it.
// Everything he eats becomes explosive goo to spit (up to 5).
function eat(x, y, f, k, now) {
  const food = rocks.filter(r => !r.back && Math.abs(r.x + r.w / 2 - hero.x) < 260)
    .sort((p, q) => Math.abs(p.x + p.w / 2 - hero.x) - Math.abs(q.x + q.w / 2 - hero.x))[0];
  if (!food || hero.ammo >= 5) { effects.push({ kind: 'tongue', x, y, tx: x + f * 80, ty: y, born: now, life: 300 }); return; }
  effects.push({ kind: 'tongue', x, y, tx: food.x + food.w / 2, ty: GROUND - food.h / 2, born: now, life: 300 });
  setTimeout(() => { if (!food.back) { food.back = Date.now() + 4000; hero.ammo++; } }, 250);
}
function spitGoo(x, y, f) {
  if (!hero.ammo) { effects.push({ kind: 'hungry', born: Date.now(), life: 1000 }); return; }
  hero.ammo--;
  shots.push({ kind: 'goo', x, y, vx: f * 9, vy: -3, r: 10, life: 120, fall: 0.25, boom: true });
}

// ---- Upgrade's merge: he goes inside a box, barrel or rock and takes control of it ----
const MERGE = {
  box:    { name: 'laser box',     speed: 5, jump: 12 },
  barrel: { name: 'barrel cannon', speed: 7, jump: 10 },
  rock:   { name: 'rock tank',     speed: 3, jump: 8 },
};
const kindOf = r => r.metal ? 'barrel' : r.box ? 'box' : 'rock';

function merge(x, y, f, k, now) {
  const target = rocks.filter(r => !r.back && Math.abs(r.x + r.w / 2 - hero.x) < 130)
    .sort((p, q) => Math.abs(p.x + p.w / 2 - hero.x) - Math.abs(q.x + q.w / 2 - hero.x))[0];
  if (!target) { effects.push({ kind: 'say', text: 'Get closer to a box, barrel or rock!', born: now, life: 1500 }); return; }
  effects.push({ kind: 'stretch', x, y, f: Math.sign(target.x + target.w / 2 - hero.x) || f, born: now, life: 300, color: '#141414' });
  setTimeout(() => {
    if (!hero.alien || target.back) return;
    target.back = Infinity; // it's with Upgrade now
    hero.merged = target;
    hero.x = target.x + target.w / 2;
    flash = 10;
  }, 250);
}

// O / SWAP while merged: jump back out and leave the thing where it is.
function unmerge() {
  const r = hero.merged;
  if (!r) return;
  r.x = Math.max(0, Math.min(W - r.w, hero.x - r.w / 2));
  r.back = 0;
  hero.merged = null;
  hero.x = Math.min(W - 50, hero.x + hero.face * (r.w / 2 + 25));
  hero.y = GROUND;
  flash = 10;
}

// P while merged: each thing shoots in its own way.
function mergedShot(now) {
  const r = hero.merged, f = hero.face, x = hero.x + f * r.w / 2, y = hero.y - r.h / 2;
  const kind = kindOf(r);
  if (kind === 'barrel') { shake = 5; shots.push({ kind: 'plasma', x, y, vx: f * 11, vy: 0.5, r: 12, life: 90, boom: true }); }
  else if (kind === 'box') { [-8, 8].forEach(dy => shots.push({ kind: 'laser', x, y: y + dy, vx: f * 20, vy: 0.6, r: 4, life: 45, pierce: true })); }
  else { shots.push({ kind: 'crystal', color: '#8b5e34', x, y, vx: f * 10, vy: -2, r: 9, life: 90, fall: 0.2 }); }
}

function drawMerged(now) {
  const r = hero.merged, x = hero.x - r.w / 2, y = hero.y - r.h;
  drawThing(r, x, y);
  // Upgrade's black and green covering the whole thing
  ctx.fillStyle = 'rgba(10,10,10,0.55)'; ctx.fillRect(x, y, r.w, r.h);

  ctx.moveTo(x + 4, y + r.h - 4); ctx.lineTo(x + 4, y + r.h / 2); ctx.lineTo(x + r.w / 2, y + r.h / 2 - 6);
  ctx.moveTo(x + r.w - 4, y + 6); ctx.lineTo(x + r.w - 4, y + r.h - 10); ctx.lineTo(x + r.w / 2, y + r.h - 10);
  ctx.stroke();
  // his one big eye, looking the way he's going
  const ex = hero.x + hero.face * r.w * 0.18, ey = y + Math.min(16, r.h * 0.3);
  ctx.fillStyle = '#39ff6a'; ctx.beginPath(); ctx.arc(ex, ey, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#141414'; ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#39ff6a'; ctx.beginPath(); ctx.arc(ex + hero.face * 1.5, ey, 2.2, 0, Math.PI * 2); ctx.fill();
  hourglass(hero.x, y + r.h * 0.65, 6, omni());
}

function drawThing(r, x, y) {
  if (r.metal) {
    ctx.fillStyle = '#8a939b'; ctx.fillRect(x, y, r.w, r.h);
    ctx.fillStyle = '#5f676e'; ctx.fillRect(x, y + 10, r.w, 5); ctx.fillRect(x, y + r.h - 18, r.w, 5);

    ctx.fillStyle = '#b5833f'; ctx.fillRect(x, y, r.w, r.h);
    ctx.strokeStyle = '#7a5424'; ctx.lineWidth = 3;
    ctx.strokeRect(x + 1.5, y + 1.5, r.w - 3, r.h - 3);
    ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + r.w - 3, y + r.h - 3); ctx.moveTo(x + r.w - 3, y + 3); ctx.lineTo(x + 3, y + r.h - 3); ctx.stroke();

  }
}

function draw() {
  const now = Date.now();
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // sky and ground
  ctx.fillStyle = '#1d3b52'; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#c99a5b'; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = '#7d5a2f'; ctx.fillRect(-20, GROUND, W + 40, 6);
  // rocks, barrels and the box: powers can smash them, and they come back after a few seconds
  rocks.forEach(r => { if (!r.back) drawThing(r, r.x, GROUND - r.h); });

  if (hero.alien) {
    ctx.save();
    if (now < hero.ghost) ctx.globalAlpha = 0.25;
    if (hero.merged) drawMerged(now); else drawAlien(hero.x, hero.y, hero.alien);
    ctx.restore();
  } else drawBenjji(hero.x, hero.y);
  drawPowers(now);
  ctx.restore();

  if (flash) {
    ctx.fillStyle = `rgba(57,255,106,${flash / 25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
