<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Benjji 10</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1a10; color: #eaffea;
    font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  #game { display: block; margin: 0 auto; background: #1d3b52; max-width: 100%; }
  #hud { position: absolute; top: 8px; left: 0; right: 0; text-align: center;
    font-weight: 700; text-shadow: 0 2px 0 #000; pointer-events: none; }
  .pad { position: absolute; bottom: 16px; display: flex; gap: 10px; align-items: center; }
  .pad button { width: 58px; height: 58px; border-radius: 50%; border: 3px solid #39ff6a;
    background: #102a17cc; color: #eaffea; font-size: 24px; font-weight: 700; }
  #left { left: 16px; }
  #right { right: 16px; }
  #powerBtn { background: #ff8a1f; color: #000; font-size: 12px; border-color: #ffd23a; }
  #watchBtn { width: 80px; height: 80px; background: #39ff6a; color: #000; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game" width="800" height="450"></canvas>
<div id="hud">Benjji · Y to pick an alien, W to go hero</div>
<div class="pad" id="left">
  <button data-key="left">◀</button>
  <button data-key="right">▶</button>
</div>
<div class="pad" id="right">
  <button data-key="up">▲</button>
  <button data-key="dial">Y</button>
  <button id="powerBtn" data-key="power">POWER</button>
  <button id="watchBtn" data-key="watch">WATCH</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const W = canvas.width, H = canvas.height, GROUND = H - 70;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// The watch's aliens: the first ten from the show, plus Cannonbolt and Wildvine, who
// were unlocked later. Each one moves differently and has its own power (P).
const ALIENS = [
  { name: 'Heatblast',   draw: drawHeatblast,   speed: 5,   jump: 13, size: 1.0,  power: 'Fireballs',       use: fireballs },
  { name: 'Wildmutt',    draw: drawWildmutt,    speed: 8,   jump: 14, size: 1.0,  power: 'Super pounce',    use: pounce },
  { name: 'Diamondhead', draw: drawDiamondhead, speed: 4.5, jump: 11, size: 1.05, power: 'Crystal shards',  use: crystals },
  { name: 'XLR8',        draw: drawXLR8,        speed: 12,  jump: 12, size: 0.95, power: 'Speed dash',      use: speedDash },
  { name: 'Grey Matter', draw: drawGreyMatter,  speed: 3,   jump: 9,  size: 0.45, power: 'Super brain',     use: superBrain },
  { name: 'Four Arms',   draw: drawFourArms,    speed: 3.5, jump: 10, size: 1.3,  power: 'Ground smash',    use: groundSmash },
  { name: 'Stinkfly',    draw: drawStinkfly,    speed: 6,   jump: 10, size: 0.95, power: 'Slime spit',      use: slime, fly: true },
  { name: 'Ripjaws',     draw: drawRipjaws,     speed: 4,   jump: 11, size: 1.05, power: 'Mega chomp',      use: chomp },
  { name: 'Upgrade',     draw: drawUpgrade,     speed: 5,   jump: 12, size: 1.0,  power: 'Laser beam',      use: laser },
  { name: 'Ghostfreak',  draw: drawGhostfreak,  speed: 5,   jump: 10, size: 1.05, power: 'Go invisible',    use: vanish, fly: true },
  { name: 'Cannonbolt',  draw: drawCannonbolt,  speed: 4,   jump: 11, size: 1.1,  power: 'Cannonball roll', use: roll },
  { name: 'Wildvine',    draw: drawWildvine,    speed: 5,   jump: 13, size: 1.05, power: 'Seed bombs',      use: seedBombs },
];
// Like the show: an alien lasts 10 minutes, then the watch turns red and has to recharge.
const HERO_MS = 10 * 60 * 1000;
const RECHARGE_MS = 5 * 1000;

const hero = { x: 120, y: GROUND, vy: 0, face: 1, alien: null, until: 0, recharge: 0, dial: 0, walk: 0,
  cool: 0, dash: 0, dashV: 0, rolling: 0, ghost: 0 };
const keys = {};

// W / WATCH: press once to go hero, press again to change back.
function useWatch() {
  if (hero.alien) return changeBack(false);
  if (Date.now() < hero.recharge) return;
  hero.alien = ALIENS[hero.dial];
  hero.until = Date.now() + HERO_MS;
  flash = 20;
}

// Y: turn the dial to pick an alien, or change back if already an alien.
function dial() {
  if (hero.alien) return changeBack(false);
  hero.dial = (hero.dial + 1) % ALIENS.length;
}

function changeBack(timedOut) {
  hero.alien = null;
  hero.dash = hero.rolling = hero.ghost = 0;
  if (timedOut) hero.recharge = Date.now() + RECHARGE_MS;
  flash = 20;
}

// The watch glows green, blinks red in the last 10 seconds, and stays red while recharging.
function omni() {
  const now = Date.now();
  if (now < hero.recharge) return '#ff3030';
  if (hero.alien && hero.until - now < 10000) return Math.floor(now / 250) % 2 ? '#ff3030' : '#39ff6a';
  return '#39ff6a';
}

const ACTIONS = { watch: useWatch, dial, power: usePower };
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ' ': 'up', w: 'watch', W: 'watch', y: 'dial', Y: 'dial', p: 'power', P: 'power' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (ACTIONS[k]) { if (!e.repeat) ACTIONS[k](); } else keys[k] = true;
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (k) keys[k] = false;
});
document.querySelectorAll('[data-key]').forEach(b => {
  const k = b.dataset.key;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (ACTIONS[k]) ACTIONS[k](); else keys[k] = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, () => keys[k] = false));
});

let flash = 0;

function clock(ms) {
  const sec = Math.ceil(ms / 1000);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}

function update() {
  const a = hero.alien;
  const speed = a ? a.speed : 4, jump = a ? a.jump : 11;
  let moving = false;
  if (keys.left)  { hero.x -= speed; hero.face = -1; moving = true; }
  if (keys.right) { hero.x += speed; hero.face = 1;  moving = true; }
  hero.x = Math.max(50, Math.min(W - 50, hero.x));
  if (keys.up && a && a.fly) hero.vy = Math.max(hero.vy - 1.2, -6); // flyers keep going up
  else if (keys.up && hero.y >= GROUND) hero.vy = -jump;
  hero.vy += 0.6;
  hero.y = Math.max(170, Math.min(GROUND, hero.y + hero.vy));
  if (hero.y >= GROUND) hero.vy = 0;
  hero.walk = moving ? hero.walk + 0.25 : 0;

  const now = Date.now();
  updatePowers(now);
  if (a && now >= hero.until) changeBack(true);
  if (flash) flash--;

  if (hero.alien) hud.textContent = `${a.name} · P for ${a.power} · ${clock(hero.until - now)} left · W or Y to change back`;
  else if (now < hero.recharge) hud.textContent = `Watch recharging… ${Math.ceil((hero.recharge - now) / 1000)}s`;
  else hud.textContent = `Benjji · alien ${hero.dial + 1} of ${ALIENS.length}: ${ALIENS[hero.dial].name} · Y to pick, W to go hero!`;
}

// The hourglass symbol: two green triangles meeting in the middle.
function hourglass(cx, cy, r, glow) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.moveTo(-r * 0.8, -r * 0.6); ctx.lineTo(r * 0.8, -r * 0.6); ctx.lineTo(0, 0);
  ctx.moveTo(-r * 0.8,  r * 0.6); ctx.lineTo(r * 0.8,  r * 0.6); ctx.lineTo(0, 0);
  ctx.fill();
  ctx.strokeStyle = '#ccc'; ctx.lineWidth = Math.max(1, r * 0.2);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

const SCALE = 1.9; // how big the characters are on screen
const SKIN = '#f3c9a0', LINE = '#2a1a10';

// A thick rounded limb with a dark outline.
function seg(x1, y1, x2, y2, w, color) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = LINE; ctx.lineWidth = w + 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = color; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function shape(fill, build) {
  ctx.beginPath(); build(); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5; ctx.stroke();
}

// A cartoon hand: palm, four finger bumps and a thumb.
function hand(x, y, angle, skin) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
  shape(skin, () => ctx.ellipse(0, 0, 5.5, 5, 0, 0, Math.PI * 2));
  for (let i = 0; i < 4; i++) shape(skin, () => ctx.ellipse(5, -3.6 + i * 2.4, 2.6, 1.5, 0, 0, Math.PI * 2));
  shape(skin, () => ctx.ellipse(1, -5.5, 1.8, 3, -0.5, 0, Math.PI * 2));
  ctx.restore();
}

function sneaker(x, y) {
  shape('#1c1c1c', () => { ctx.moveTo(x - 7, y - 1); ctx.quadraticCurveTo(x - 6, y - 9, x + 2, y - 8); ctx.quadraticCurveTo(x + 11, y - 6, x + 11, y - 1); });
  shape('#f2f2f2', () => ctx.rect(x - 8, y - 2, 20, 3));
  ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x - 2, y - 7); ctx.lineTo(x + 3, y - 4); ctx.stroke();
}

function drawBenjji(x, y) {
  const s = Math.sin(hero.walk) * 9;
  const air = hero.y < GROUND;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * SCALE, SCALE);

  // back arm (a little darker because it's behind him)
  seg(-11, -80, -13 - s / 3, -64, 8, '#dcdcd8');
  seg(-13 - s / 3, -64, -12 - s / 2, -52, 6.5, '#e2b48c');
  hand(-12 - s / 2, -49, Math.PI / 2, '#e2b48c');

  // legs: olive cargo pants
  const backFoot = air ? -6 : -6 - s, frontFoot = air ? 8 : 6 + s;
  seg(-5, -46, backFoot, -9, 12, '#46542c');
  sneaker(backFoot, 0);
  seg(5, -46, frontFoot, -9, 12, '#56673a');
  shape('#4a5a2e', () => ctx.rect(frontFoot / 2 + 3, -36, 7, 7)); // cargo pocket
  sneaker(frontFoot, 0);

  // body: white T-shirt with the black stripe down the middle
  shape('#f7f7f4', () => {
    ctx.moveTo(-15, -86); ctx.quadraticCurveTo(0, -91, 15, -86);
    ctx.lineTo(16, -46); ctx.lineTo(-16, -46);
  });
  ctx.fillStyle = '#1b1b1b'; ctx.fillRect(-3, -88, 7, 42);
  ctx.fillStyle = '#e4e4df'; ctx.fillRect(-15, -84, 4, 38); // shade
  // collar
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(1, -89, 5, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  // belt line
  ctx.fillStyle = '#3a4524'; ctx.fillRect(-16, -48, 32, 4);

  // neck
  seg(1, -90, 1, -95, 8, SKIN);

  // head: a bit rounder and bigger, so he looks younger
  shape(SKIN, () => ctx.ellipse(3, -113, 18, 20, 0, 0, Math.PI * 2));
  shape(SKIN, () => ctx.ellipse(-10, -111, 4, 6, 0, 0, Math.PI * 2)); // ear
  // eyes: big and green
  [[6, 4, 5], [16, 3.4, 4.4]].forEach(([ex, rx, ry]) => {
    shape('#fff', () => ctx.ellipse(ex, -114, rx, ry, 0, 0, Math.PI * 2));
    ctx.fillStyle = '#35a84a'; ctx.beginPath(); ctx.arc(ex + 1, -113.5, rx * 0.75, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0d0d0d'; ctx.beginPath(); ctx.arc(ex + 1.2, -113.5, rx * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + 2, -115, 0.9, 0, Math.PI * 2); ctx.fill();
  });
  // eyebrows
  ctx.strokeStyle = '#4a2a14'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, -121); ctx.lineTo(9, -122); ctx.moveTo(13, -121.5); ctx.lineTo(19, -121); ctx.stroke();
  // nose and a confident smile
  ctx.strokeStyle = '#b07a55'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(20, -110); ctx.quadraticCurveTo(22, -107, 19, -106); ctx.stroke();
  ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(9, -101); ctx.quadraticCurveTo(14, -98, 18, -102); ctx.stroke();

  // spiky brown hair swept to the front
  shape('#5c3317', () => {
    ctx.moveTo(-15, -103); ctx.lineTo(-18, -117); ctx.lineTo(-13, -129); ctx.lineTo(-1, -136);
    ctx.lineTo(13, -134); ctx.lineTo(24, -127); ctx.lineTo(23, -119); ctx.lineTo(19, -123);
    ctx.lineTo(16, -117); ctx.lineTo(12, -123); ctx.lineTo(7, -118); ctx.lineTo(3, -124);
    ctx.lineTo(-3, -120); ctx.lineTo(-5, -110); ctx.lineTo(-9, -103);
  });
  ctx.strokeStyle = '#8a5530'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-8, -129); ctx.quadraticCurveTo(4, -134, 16, -130); ctx.stroke();

  // front arm, bent forward to show off the watch
  seg(11, -80, 15, -64, 8, '#f7f7f4');
  seg(15, -64, 29, -58, 6.5, SKIN);
  hand(33, -57, -0.3, SKIN);
  // the watch: chunky band with the hourglass face
  shape('#2b2b2b', () => ctx.rect(23, -63, 7, 10));
  shape('#7a7a7a', () => ctx.rect(22, -62, 9, 2));
  hourglass(26.5, -58, 5.5, omni());

  ctx.restore();
}

// Each alien is drawn facing right with its feet at y = 0, like Benjji.
function drawAlien(x, y, a) {
  const t = Date.now() / 120;
  const s = hero.y < GROUND ? 0 : Math.sin(hero.walk) * 9;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(hero.face * a.size * SCALE, a.size * SCALE);
  a.draw(s, t);
  ctx.restore();
}

function drawHeatblast(s, t) {
  const rock = '#8e2416', rockDark = '#6a180e', glow = '#ffcf3a';
  // back arm and legs
  seg(-12, -84, -16 - s / 3, -58, 9, rockDark);
  shape('#ff8a1f', () => ctx.arc(-16 - s / 3, -54, 6, 0, Math.PI * 2));
  seg(-5, -46, -6 - s, -6, 12, rockDark);
  seg(5, -46, 6 + s, -6, 12, rock);
  // rocky body with glowing magma cracks
  shape(rock, () => {
    ctx.moveTo(-17, -88); ctx.lineTo(-6, -92); ctx.lineTo(16, -90); ctx.lineTo(19, -62);
    ctx.lineTo(12, -44); ctx.lineTo(-12, -44); ctx.lineTo(-18, -63);
  });
  ctx.strokeStyle = glow; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-14, -80); ctx.lineTo(-8, -72); ctx.lineTo(-12, -60); ctx.lineTo(-6, -50);
  ctx.moveTo(14, -82); ctx.lineTo(9, -74); ctx.lineTo(13, -62); ctx.lineTo(8, -48);
  ctx.moveTo(-4, -46); ctx.lineTo(0, -54); ctx.lineTo(5, -46);
  ctx.moveTo(-5, -30); ctx.lineTo(-7, -20); ctx.moveTo(6, -32); ctx.lineTo(8, -18);
  ctx.stroke();
  hourglass(0, -68, 7, omni());
  // head made of fire, flickering
  const flick = i => Math.sin(t * 1.3 + i * 1.7) * 4;
  shape('#ff6a1a', () => {
    ctx.moveTo(-14, -94); ctx.lineTo(-18, -114 + flick(1)); ctx.lineTo(-10, -110);
    ctx.lineTo(-8, -134 + flick(2)); ctx.lineTo(0, -120); ctx.lineTo(6, -142 + flick(3));
    ctx.lineTo(10, -122); ctx.lineTo(20, -134 + flick(4)); ctx.lineTo(18, -112);
    ctx.lineTo(24, -104 + flick(5)); ctx.lineTo(18, -94);
  });
  shape('#ffb21f', () => {
    ctx.moveTo(-8, -96); ctx.lineTo(-8, -118 + flick(6)); ctx.lineTo(0, -110);
    ctx.lineTo(6, -128 + flick(7)); ctx.lineTo(10, -112); ctx.lineTo(16, -118 + flick(8)); ctx.lineTo(14, -96);
  });
  // face: bright eyes and a grin
  ctx.fillStyle = '#fffbe0';
  ctx.beginPath(); ctx.ellipse(5, -107, 3.5, 2, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -107, 3, 1.8, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#7a1c06'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(5, -100); ctx.quadraticCurveTo(10, -97, 15, -100); ctx.stroke();
  // front arm with a flaming fist
  seg(13, -84, 26, -66, 9, rock);
  shape('#ff8a1f', () => ctx.arc(29, -64, 7, 0, Math.PI * 2));
  shape(glow, () => { ctx.moveTo(24, -68); ctx.lineTo(28, -82 + flick(9)); ctx.lineTo(31, -72); ctx.lineTo(36, -80 + flick(10)); ctx.lineTo(35, -66); });
}

function drawXLR8(s, t) {
  const blue = '#1f4fc4', black = '#141824';
  if (keys.left || keys.right) { // speed streaks
    ctx.strokeStyle = '#9fd0ff'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-70, -95 + i * 18); ctx.lineTo(-110 - (i % 2) * 20, -95 + i * 18); ctx.stroke(); }
  }
  // long striped tail
  const tail = [[-8, -58], [-24, -56], [-40, -50], [-56, -42], [-70, -36]];
  for (let i = 0; i < tail.length - 1; i++) {
    seg(tail[i][0], tail[i][1], tail[i + 1][0], tail[i + 1][1], 12 - i * 2.5, i % 2 ? blue : black);
  }
  // legs bend like a raptor's, with a ball on each foot
  [[-4, -s, black], [5, s, blue]].forEach(([hx, sw, c]) => {
    seg(hx, -50, hx - 8, -28, 10, c);
    seg(hx - 8, -28, hx + 2 + sw, -9, 7, black);
    shape('#2b2b2b', () => ctx.arc(hx + 2 + sw, -6, 6, 0, Math.PI * 2));
  });
  // body leaning forward
  shape(black, () => ctx.ellipse(4, -72, 15, 24, 0.35, 0, Math.PI * 2));
  shape(blue, () => ctx.ellipse(9, -74, 7, 17, 0.35, 0, Math.PI * 2));
  hourglass(6, -76, 6, omni());
  // arms with claws
  seg(4, -88, 18, -76, 6, black);
  seg(18, -76, 30, -80, 5, blue);
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); for (let i = 0; i < 3; i++) { ctx.moveTo(31, -80); ctx.lineTo(37, -84 + i * 3); } ctx.stroke();
  // long head with the black visor
  shape(blue, () => ctx.ellipse(20, -104, 17, 10, 0.15, 0, Math.PI * 2));
  shape(black, () => { ctx.moveTo(6, -112); ctx.quadraticCurveTo(24, -120, 37, -104); ctx.lineTo(30, -102); ctx.quadraticCurveTo(20, -110, 6, -104); });
  ctx.strokeStyle = '#6a8cff'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(12, -112); ctx.quadraticCurveTo(22, -116, 30, -109); ctx.stroke();
  ctx.strokeStyle = black; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(22, -97); ctx.lineTo(34, -99); ctx.stroke();
}

function drawFourArms(s, t) {
  const red = '#c8312a', redDark = '#9c231e';
  const arm = (sx, sy, ex, ey, hx, hy, c) => {
    seg(sx, sy, ex, ey, 11, c); seg(ex, ey, hx, hy, 10, c);
    shape(c, () => ctx.arc(hx, hy + 3, 7, 0, Math.PI * 2));
  };
  // back arms
  arm(-18, -90, -26, -72, -24 - s / 3, -56, redDark);
  arm(-16, -74, -24, -58, -20 - s / 3, -44, redDark);
  // legs in black pants, bare red feet
  seg(-7, -46, -7 - s, -8, 15, '#1c1c1c');
  seg(7, -46, 7 + s, -8, 15, '#262626');
  shape(red, () => ctx.ellipse(-5 - s, -3, 9, 4, 0, 0, Math.PI * 2));
  shape(red, () => ctx.ellipse(9 + s, -3, 9, 4, 0, 0, Math.PI * 2));
  // huge chest with muscles
  shape(red, () => {
    ctx.moveTo(-24, -96); ctx.quadraticCurveTo(2, -104, 26, -96);
    ctx.lineTo(18, -50); ctx.lineTo(-14, -50);
  });
  ctx.strokeStyle = redDark; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(1, -94); ctx.lineTo(1, -54);
  ctx.moveTo(-14, -80); ctx.quadraticCurveTo(-6, -76, 1, -80);
  ctx.moveTo(16, -80); ctx.quadraticCurveTo(8, -76, 1, -80);
  ctx.moveTo(-8, -66); ctx.lineTo(10, -66); ctx.moveTo(-6, -58); ctx.lineTo(10, -58);
  ctx.stroke();
  // white belt with the watch symbol
  shape('#f2f2f2', () => ctx.rect(-15, -54, 34, 8));
  hourglass(2, -50, 6, omni());
  // small head on big shoulders, with four yellow eyes
  shape(red, () => ctx.ellipse(4, -108, 12, 12, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#ffd400';
  [[4, -113], [12, -113], [4, -106], [12, -106]].forEach(([ex, ey]) => {
    ctx.beginPath(); ctx.ellipse(ex, ey, 2.6, 1.8, 0, 0, Math.PI * 2); ctx.fill();
  });
  ctx.strokeStyle = '#5a1210'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(4, -100); ctx.lineTo(13, -100); ctx.stroke();
  shape('#1c1c1c', () => { ctx.moveTo(-6, -116); ctx.quadraticCurveTo(-4, -124, 6, -121); ctx.lineTo(-2, -114); });
  // front arms
  arm(20, -74, 30, -60, 34 + s / 3, -48, red);
  arm(22, -90, 32, -76, 38 + s / 3, -66, red);
}

// ---- Powers ----
const shots = [], effects = [], bits = [];
const rocks = [[150, 70], [480, 90], [700, 60]].map(([x, h]) => ({ x, h, w: 50, back: 0 }));
let shake = 0;

// P / POWER: use the current alien's power.
function usePower() {
  const a = hero.alien, now = Date.now();
  if (!a || now < hero.cool) return;
  hero.cool = now + 400;
  const k = a.size * SCALE, f = hero.face;
  a.use(hero.x + f * 30 * k, hero.y - 45 * k, f, k, now);
}

function fireballs(x, y, f) { shots.push({ kind: 'fire', x, y, vx: f * 10, vy: 1, r: 9, life: 90 }); }
function crystals(x, y, f) { for (let i = -1; i <= 1; i++) shots.push({ kind: 'crystal', x, y, vx: f * 11, vy: 1 + i * 1.5, r: 6, life: 70 }); }
function slime(x, y, f) { shots.push({ kind: 'slime', x, y: y - 30, vx: f * 8, vy: -2, r: 8, life: 120, fall: 0.25 }); }
function laser(x, y, f) { shots.push({ kind: 'laser', x, y, vx: f * 20, vy: 1.5, r: 4, life: 45, pierce: true }); }
function seedBombs(x, y, f) { shots.push({ kind: 'seed', x, y, vx: f * 6, vy: -8, r: 6, life: 200, fall: 0.4, boom: true }); }
function pounce(x, y, f, k, now) { hero.vy = -14; hero.dash = now + 600; hero.dashV = f * 11; }
function speedDash(x, y, f, k, now) { hero.dash = now + 450; hero.dashV = f * 26; }
function roll(x, y, f, k, now) { hero.rolling = now + 3000; }
function vanish(x, y, f, k, now) { hero.ghost = now + 5000; }
function groundSmash(x, y, f, k, now) { hero.vy = 0; shake = 15; blast(hero.x, GROUND, 170, 'quake'); }
function chomp(x, y, f, k) { blast(x + f * 20, y, 70, 'chomp', f); }
// Grey Matter works out the weak spot of the nearest rock, and it crumbles.
function superBrain(x, y, f, k, now) {
  effects.push({ kind: 'idea', born: now, life: 1500 });
  const target = rocks.filter(r => !r.back).sort((p, q) => Math.abs(p.x + 25 - hero.x) - Math.abs(q.x + 25 - hero.x))[0];
  if (target) setTimeout(() => smashRock(target), 700);
}

function smashRock(r) {
  if (r.back) return;
  r.back = Date.now() + 4000;
  for (let i = 0; i < 10; i++) bits.push({ x: r.x + 25, y: GROUND - r.h / 2, vx: (Math.random() - 0.5) * 10, vy: -Math.random() * 9, life: 60 });
}

function blast(x, y, radius, kind, f) {
  effects.push({ kind, x, y, r: radius, f, born: Date.now(), life: 400 });
  rocks.forEach(r => { if (Math.abs(r.x + 25 - x) < radius + 25 && y > GROUND - r.h - radius) smashRock(r); });
}

function hitsRock(x, y, pad) {
  return rocks.find(r => !r.back && x > r.x - pad && x < r.x + r.w + pad && y > GROUND - r.h - pad);
}

function updatePowers(now) {
  const a = hero.alien;
  if (a && now < hero.dash) hero.x += hero.dashV;
  if (a && now < hero.rolling) {
    hero.x += hero.face * 10;
    if (hero.x <= 50 || hero.x >= W - 50) hero.face *= -1; // bounce off the edges
  }
  hero.x = Math.max(50, Math.min(W - 50, hero.x));
  // smash rocks by running, pouncing or rolling into them
  if (a && (now < hero.dash || now < hero.rolling)) {
    const r = hitsRock(hero.x, hero.y - 10, 20);
    if (r) { smashRock(r); shake = 6; }
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const p = shots[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.fall || 0;
    let dead = --p.life <= 0 || p.x < -20 || p.x > W + 20;
    const r = hitsRock(p.x, p.y, p.r);
    if (r) { smashRock(r); if (!p.pierce) dead = true; }
    if (p.y >= GROUND) { p.y = GROUND; dead = true; }
    if (dead) { if (p.boom) blast(p.x, p.y, 70, 'boom'); shots.splice(i, 1); }
  }
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.x += b.vx; b.y += b.vy; b.vy += 0.5;
    if (--b.life <= 0) bits.splice(i, 1);
  }
  for (let i = effects.length - 1; i >= 0; i--) if (now - effects[i].born > effects[i].life) effects.splice(i, 1);
  rocks.forEach(r => { if (r.back && now > r.back) r.back = 0; });
  if (shake) shake--;
}

function drawPowers(now) {
  shots.forEach(p => {
    if (p.kind === 'fire') {
      ctx.fillStyle = '#ff6a1a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffe14d'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,120,30,0.4)'; ctx.beginPath(); ctx.arc(p.x - p.vx, p.y, p.r * 0.8, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === 'crystal') {
      const d = Math.sign(p.vx);
      shape('#3fd18a', () => { ctx.moveTo(p.x + d * 10, p.y); ctx.lineTo(p.x - d * 6, p.y - 5); ctx.lineTo(p.x - d * 6, p.y + 5); });
    } else if (p.kind === 'slime') {
      shape('#9ccf3a', () => ctx.ellipse(p.x, p.y, p.r, p.r * 0.75, 0, 0, Math.PI * 2));
    } else if (p.kind === 'laser') {
      ctx.strokeStyle = '#39ff6a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y); ctx.stroke();
      ctx.strokeStyle = '#eaffea'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y); ctx.stroke();
    } else if (p.kind === 'seed') {
      shape('#6b8e23', () => ctx.ellipse(p.x, p.y, 6, 8, now / 100, 0, Math.PI * 2));
    }
  });
  bits.forEach(b => { ctx.fillStyle = '#8b5e34'; ctx.fillRect(b.x - 4, b.y - 4, 8, 8); });
  effects.forEach(e => {
    const t = (now - e.born) / e.life;
    ctx.save(); ctx.globalAlpha = 1 - t;
    if (e.kind === 'quake' || e.kind === 'boom') {
      ctx.strokeStyle = e.kind === 'quake' ? '#f2e6c9' : '#ff8a1f'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(e.x, e.y, e.r * t + 10, (e.r * t + 10) * (e.kind === 'quake' ? 0.25 : 0.8), 0, 0, Math.PI * 2); ctx.stroke();
    } else if (e.kind === 'chomp') {
      ctx.fillStyle = '#fff';
      const open = 20 * (1 - t);
      for (let i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(e.x - 25 + i * 10, e.y - open); ctx.lineTo(e.x - 20 + i * 10, e.y - open + 12); ctx.lineTo(e.x - 15 + i * 10, e.y - open); ctx.fill();
        ctx.beginPath(); ctx.moveTo(e.x - 25 + i * 10, e.y + open); ctx.lineTo(e.x - 20 + i * 10, e.y + open - 12); ctx.lineTo(e.x - 15 + i * 10, e.y + open); ctx.fill();
      }
    } else if (e.kind === 'idea') {
      const bx = hero.x + hero.face * 10, by = hero.y - 110;
      shape('#ffffff', () => ctx.ellipse(bx, by, 34, 20, 0, 0, Math.PI * 2));
      shape('#ffe14d', () => ctx.arc(bx - 14, by - 2, 7, 0, Math.PI * 2));
      ctx.fillStyle = '#222'; ctx.font = 'bold 12px system-ui'; ctx.fillText('E=mc²', bx - 4, by + 4);
    }
    ctx.restore();
  });
}

function drawCannonbolt(s, t) {
  const shell = '#f1ead2', plate = '#e6b400', skin = '#3a3a3a';
  if (Date.now() < hero.rolling) { // curled up into a ball
    ctx.save(); ctx.translate(0, -30); ctx.rotate(hero.x / 30);
    shape(shell, () => ctx.arc(0, 0, 30, 0, Math.PI * 2));
    ctx.strokeStyle = plate; ctx.lineWidth = 6;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, 30 - i * 9, i, i + 2.2); ctx.stroke(); }
    ctx.restore();
    return;
  }
  seg(-10, -40, -11 - s, -6, 10, skin);
  seg(10, -40, 11 + s, -6, 10, skin);
  seg(-24, -70, -30, -44, 8, skin);
  // big round shell body with yellow plates
  shape(shell, () => ctx.ellipse(0, -62, 30, 34, 0, 0, Math.PI * 2));
  ctx.strokeStyle = plate; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(-6, -62, 30, Math.PI * 0.6, Math.PI * 1.4); ctx.stroke();
  ctx.beginPath(); ctx.arc(-6, -62, 20, Math.PI * 0.65, Math.PI * 1.35); ctx.stroke();
  shape(skin, () => ctx.ellipse(12, -62, 12, 20, 0, 0, Math.PI * 2));
  hourglass(12, -60, 6, omni());
  // small head peeking out the top
  shape(skin, () => ctx.ellipse(14, -98, 10, 9, 0, 0, Math.PI * 2));
  shape(shell, () => { ctx.moveTo(2, -100); ctx.quadraticCurveTo(12, -112, 24, -102); ctx.lineTo(20, -104); ctx.quadraticCurveTo(12, -108, 4, -98); });
  ctx.fillStyle = '#39ff6a';
  ctx.beginPath(); ctx.ellipse(18, -99, 2.5, 2, 0, 0, Math.PI * 2); ctx.fill();
  seg(24, -72, 32, -52, 8, skin);
}

function drawWildvine(s, t) {
  const green = '#4f9a2e', dark = '#2f6a1a', leaf = '#7ccf4a';
  // seed pods on the back
  [[-14, -84], [-18, -72], [-16, -60]].forEach(([px, py]) => shape('#8a6a2a', () => ctx.ellipse(px, py, 5, 6, 0, 0, Math.PI * 2)));
  seg(-8, -80, -18 - s / 3, -50, 6, dark);
  // vine legs with root feet
  seg(-4, -46, -5 - s, -6, 8, dark);
  seg(4, -46, 5 + s, -6, 8, green);
  shape(dark, () => { ctx.moveTo(-14 - s, 0); ctx.lineTo(-5 - s, -8); ctx.lineTo(2 - s, 0); });
  shape(green, () => { ctx.moveTo(-2 + s, 0); ctx.lineTo(6 + s, -8); ctx.lineTo(14 + s, 0); });
  // twisty vine body
  shape(green, () => { ctx.moveTo(-10, -88); ctx.quadraticCurveTo(4, -70, -6, -46); ctx.lineTo(8, -46); ctx.quadraticCurveTo(16, -70, 10, -88); });
  ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-4, -84); ctx.quadraticCurveTo(8, -70, 0, -50); ctx.stroke();
  hourglass(4, -72, 6, omni());
  // flower head with one big eye
  for (let i = 0; i < 6; i++) {
    const ang = i * Math.PI / 3 + Math.sin(t / 3) * 0.1;
    shape(leaf, () => ctx.ellipse(4 + Math.cos(ang) * 14, -106 + Math.sin(ang) * 14, 7, 4, ang, 0, Math.PI * 2));
  }
  shape(green, () => ctx.ellipse(4, -106, 12, 12, 0, 0, Math.PI * 2));
  shape('#e9ff7a', () => ctx.ellipse(8, -107, 5, 6, 0, 0, Math.PI * 2));
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(9, -107, 2.3, 0, Math.PI * 2); ctx.fill();
  // long stretchy front arm with a leafy hand
  seg(10, -82, 22, -70, 6, green);
  seg(22, -70, 36, -64, 5, green);
  shape(leaf, () => ctx.ellipse(40, -63, 7, 4, -0.3, 0, Math.PI * 2));
}

function draw() {
  const now = Date.now();
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // sky and ground
  ctx.fillStyle = '#1d3b52'; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.fillStyle = '#c99a5b'; ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
  ctx.fillStyle = '#7d5a2f'; ctx.fillRect(-20, GROUND, W + 40, 6);
  // desert rocks: powers can smash them, and they come back after a few seconds
  ctx.fillStyle = '#8b5e34';
  rocks.forEach(r => { if (!r.back) ctx.fillRect(r.x, GROUND - r.h, r.w, r.h); });

  if (hero.alien) {
    ctx.save();
    if (now < hero.ghost) ctx.globalAlpha = 0.25;
    drawAlien(hero.x, hero.y, hero.alien);
    ctx.restore();
  } else drawBenjji(hero.x, hero.y);
  drawPowers(now);
  ctx.restore();

  if (flash) {
    ctx.fillStyle = `rgba(57,255,106,${flash / 25})`;
    ctx.fillRect(0, 0, W, H);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
